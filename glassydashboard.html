<script>
/* ===== Jaringan HTTP FS bersama (v5): login server otomatis di semua permintaan + tulis berkas yang tahan banting ===== */
(function(){
 if(window.gdPut)return;
 var K='gd-auth';
 try{var _o=JSON.parse(localStorage.getItem(K)||'null');if(_o&&_o.u==='beldua'&&_o.p==='nanda')localStorage.removeItem(K)}catch(e){}
 function b64(s){var b=new TextEncoder().encode(s),x='';for(var i=0;i<b.length;i++)x+=String.fromCharCode(b[i]);return btoa(x)}
 function cred(){try{var a=JSON.parse(localStorage.getItem(K)||'null');return a&&a.u?a:null}catch(e){return null}}
 function hdr(){var a=cred();return a?'Basic '+b64(a.u+':'+(a.p||'')):''}
 var ORG=(window.origin&&window.origin!=='null')?window.origin:location.origin;
 function same(u){try{return new URL(String(u),document.baseURI).origin===ORG}catch(e){return false}}
 window.gdB64=b64;
 var _f=window.fetch.bind(window);
 window.fetch=function(input,init){
  try{
   var url=typeof input==='string'?input:((input&&input.url)||String(input));
   var h=hdr();
   if(h&&same(url)){
    init=Object.assign({},init||{});
    var hd=new Headers(init.headers||(input&&input.headers)||undefined);
    if(!hd.has('Authorization'))hd.set('Authorization',h);
    init.headers=hd;
   }
  }catch(e){}
  return _f(input,init);
 };
 var _o2=XMLHttpRequest.prototype.open,_s=XMLHttpRequest.prototype.send;
 XMLHttpRequest.prototype.open=function(m,u){this._gdSame=same(u);return _o2.apply(this,arguments)};
 XMLHttpRequest.prototype.send=function(){try{var h=hdr();if(this._gdSame&&h)this.setRequestHeader('Authorization',h)}catch(e){}return _s.apply(this,arguments)};
 /* alasan gagal yang bisa dibaca orang */
 window.gdWhy=function(c){c=+c;
  if(!c)return 'server tidak terjangkau';
  if(c===401)return 'server meminta login (HTTP 401) — simpan nama pengguna & sandi di Pengaturan › Server HTTP FS';
  if(c===403)return 'tidak ada izin tulis (HTTP 403)';
  if(c===405||c===501)return 'server menolak PUT (HTTP '+c+'), aktifkan izin tulis/unggah di aplikasi HTTP FS';
  if(c===404||c===409)return 'folder tujuan tidak ada (HTTP '+c+')';
  if(c===413)return 'file terlalu besar (HTTP 413)';
  if(c===507)return 'storage server penuh (HTTP 507)';
  return 'HTTP '+c};
 window.gdMkdirs=async function(dir){
  try{var u=new URL(dir,document.baseURI),segs=u.pathname.split('/').filter(Boolean),q='';
   for(var i=0;i<segs.length;i++){q+='/'+segs[i];try{await fetch(u.origin+q+'/',{method:'MKCOL',cache:'no-store'})}catch(e){}}
  }catch(e){}
 };
 /* tulis berkas: PUT -> MKCOL+PUT -> (server tanpa PUT) hapus lama + upload multipart; hasil {ok,st,how} */
 window.gdPut=async function(dir,name,body,type){
  if(dir.charAt(dir.length-1)!=='/')dir+='/';
  var url=dir+encodeURIComponent(name),ok=function(c){return c>=200&&c<300},ct=type||'application/octet-stream';
  var put=async function(){try{return (await fetch(url,{method:'PUT',headers:{'Content-Type':ct},body:body,cache:'no-store'})).status}catch(e){return 0}};
  var st=await put();if(ok(st))return{ok:true,st:st,how:'PUT'};
  if(st===404||st===409){await window.gdMkdirs(dir);st=await put();if(ok(st))return{ok:true,st:st,how:'PUT'}}
  if(st===0||st===401||st===413||st===507)return{ok:false,st:st};
  try{
   var ex=false;try{ex=(await fetch(url,{method:'HEAD',cache:'no-store'})).ok}catch(e){}
   if(ex){try{await fetch(url,{method:'DELETE',cache:'no-store'})}catch(e){}}
   var fd=new FormData();fd.append('file',new Blob([body],{type:ct}),name);
   var r=await fetch(dir,{method:'POST',body:fd,cache:'no-store'});
   if(ok(r.status)){var v=true;try{v=(await fetch(url,{method:'HEAD',cache:'no-store'})).ok}catch(e){}if(v)return{ok:true,st:r.status,how:'POST'}}
  }catch(e){}
  return{ok:false,st:st};
 };
})();
</script>

wr(KA,A);
})();

/* Pengaman layar kosong: kesalahan JS menampilkan banner yang bisa diketuk, bukan layar putih diam-diam. */
(function(){
  var last=0,tm=0;
  function show(msg){
    var now=Date.now();if(now-last<8000)return;last=now;
    var b=document.getElementById("srErr");if(!b)return;
    b.querySelector("span").textContent=msg;b.hidden=false;
    clearTimeout(tm);tm=setTimeout(function(){b.hidden=true},6000);
  }
  window.__srErr=show;
  window.addEventListener("error",function(e){var m=(e&&e.message)||"";if(/ResizeObserver/.test(m))return;show("Ada kendala kecil di halaman.")});
  window.addEventListener("unhandledrejection",function(e){var m=String((e&&e.reason&&(e.reason.message||e.reason))||"");if(/fetch|network|abort|Failed/i.test(m))return;show("Ada kendala kecil di halaman.")});
})();

<meta name="apple-mobile-web-app-title" content="Dashboard Gallery">
<meta name="application-name" content="Dashboard Gallery">
<meta name="theme-color" content="#03040a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" media="(min-width:761px)" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap">
<style>
:root{--tx:#f4f5f8;--mute:rgba(244,245,248,.56);--edge:rgba(255,255,255,.14);--blue:#5b8cff;--green:#3ddc97;--sp:cubic-bezier(.34,1.56,.64,1);color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#05060a;color:var(--tx);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#0e1424,#05060a 62%)}
.bg i{position:absolute;border-radius:50%;filter:blur(72px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:55vmax;height:55vmax;background:#2d4dff;top:-20vmax;right:-14vmax}
.bg i:nth-child(2){width:46vmax;height:46vmax;background:#ff7a1a;bottom:-22vmax;left:-10vmax;animation-delay:-6s}
.bg i:nth-child(3){width:32vmax;height:32vmax;background:#9d3cff;top:34%;left:36%;opacity:.3;animation-delay:-11s}
@keyframes drift{to{transform:translate(7vmax,-5vmax) scale(1.12)}}
.glass{position:relative;padding:20px;border-radius:22px;border:1px solid var(--edge);background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 55%,rgba(255,255,255,.08));backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 28px 60px -24px rgba(0,0,0,.7);transition:transform .55s var(--sp),border-color .3s}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.2),transparent 70%);opacity:0;transition:opacity .4s}
.glass:hover::after{opacity:1}
.lift:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.28)}
.app{display:flex;gap:18px;height:100%;padding:18px}
.sbar{width:232px;flex-shrink:0;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;font-weight:600;font-size:15px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#ff8a3d,#ff4f9a)}
nav{position:relative;flex:1;display:flex;flex-direction:column;gap:3px}
.sp{flex:1}
nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border-radius:13px;font-size:14px;font-weight:500;color:var(--mute);text-align:left;white-space:nowrap;transition:color .3s}
nav button:hover,nav button.on{color:var(--tx)}
nav svg{width:17px;height:17px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--sp)}
nav button:hover svg{transform:scale(1.15)}
.dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px var(--blue)}
main{flex:1;min-width:0;overflow-y:auto;padding:4px 4px 48px;scrollbar-width:none}
.pg{animation:enter .8s var(--sp) both}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 2px 20px}
h1{font-size:30px;font-weight:700;letter-spacing:-.025em}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.btn{height:38px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--edge);background:rgba(255,255,255,.1);transition:transform .45s var(--sp)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.93)}
.pri{background:rgba(255,255,255,.16);border-color:transparent}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.col{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.side{display:flex;flex-direction:column;gap:14px}
.stat{display:flex;flex-direction:column;gap:12px}
.ic2{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c),var(--d))}
.ic2 svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:13px;color:var(--mute)}
.num{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.up{font-size:12px;font-weight:600;color:var(--green)}
.sm{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{flex:1;min-width:0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;font-size:15px;font-weight:600}
.seg{display:flex;padding:3px;border-radius:11px;background:rgba(255,255,255,.07);font-size:12px;font-weight:500}
.seg button{padding:6px 11px;border-radius:8px;color:var(--mute);transition:all .4s var(--sp)}
.seg button.on{background:rgba(255,255,255,.17);color:var(--tx)}
.chip2{padding:5px 10px;border-radius:9px;font-size:12px;font-weight:500;color:var(--mute);background:rgba(255,255,255,.1);transition:transform .4s var(--sp)}
.chip2:hover{transform:scale(1.06)}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:rgba(61,220,151,.14);color:var(--green)}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(91,140,255,.16);color:#a9c2ff}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big{font-size:30px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:26px}
.bar{position:relative;flex:1;height:var(--h);border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.12));animation:grow .9s var(--sp) both;animation-delay:calc(var(--i)*70ms);transition:background .3s}
.bar.hi{background:linear-gradient(180deg,#9cbaff,#3461ff);box-shadow:0 0 28px rgba(91,140,255,.5)}
.bar:hover{background:linear-gradient(180deg,#fff,rgba(255,255,255,.45))}
.bar:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:5px 9px;border-radius:9px;font-size:11px;font-weight:600;white-space:nowrap;background:rgba(14,18,30,.85);border:1px solid var(--edge)}
@keyframes grow{from{height:0}}
.ax{display:flex;gap:10px;margin-top:9px;font-size:11px;color:var(--mute)}
.ax span{flex:1;text-align:center}
.mini{display:flex;align-items:flex-end;gap:5px;height:58px;margin-top:14px}
.mini .bar{border-radius:6px 6px 3px 3px}
.donut{display:flex;align-items:center;gap:20px}
.dw{position:relative;width:136px;height:136px;flex-shrink:0;animation:pop .9s var(--sp) both}
.dw svg{width:100%;height:100%;overflow:visible}
.dw circle{cursor:pointer;transition:stroke-width .4s var(--sp)}
.dw circle.hot{stroke-width:22}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ctr b{font-size:24px;font-weight:700}
.ctr span{font-size:11px;color:var(--mute);margin-top:2px}
.leg{flex:1;display:flex;flex-direction:column;gap:12px;font-size:13px;color:var(--mute)}
.leg div{display:flex;align-items:center;gap:9px;cursor:pointer;transition:color .3s,transform .5s var(--sp)}
.leg div:hover,.leg div.hot{color:var(--tx);transform:translateX(5px)}
.leg div:focus-visible{outline:2px solid rgba(255,255,255,.45);outline-offset:3px;border-radius:8px;color:var(--tx)}
.leg i{width:8px;height:8px;border-radius:50%}
.leg b{margin-left:auto;color:var(--tx);font-weight:600}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-40deg)}}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:12px;font-weight:700;background:linear-gradient(135deg,var(--c),var(--d))}
.lb{display:flex;align-items:center;gap:12px;padding:10px 0}
.lb+.lb{border-top:1px solid rgba(255,255,255,.07)}
.trk{height:6px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
.trk i{display:block;width:100%;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c),var(--d));transform-origin:left;transform:scaleX(var(--w));animation:gx 1.1s var(--sp) both;animation-delay:calc(var(--i)*90ms)}
@keyframes gx{from{transform:scaleX(0)}}
.cv{margin-bottom:14px;font-size:12.5px;color:var(--mute)}
.cv b{color:var(--tx)}

:root{--tx:#f7f0e9;--mute:rgba(247,240,233,.6);--edge:rgba(255,255,255,.12);--serif:Newsreader,"Iowan Old Style","Palatino Linotype",Georgia,serif;--pad:18px;--sbw:232px}

/* --- ruangan di belakang kaca --- */
.bg{background:radial-gradient(70% 38% at 62% 4%,rgba(236,224,205,.42),transparent 70%),radial-gradient(40% 30% at 8% 12%,rgba(96,66,44,.55),transparent 70%),linear-gradient(180deg,#8d8275 0%,#6a5f53 26%,#41362e 52%,#4a3322 70%,#8b5a30 100%)}
.bg i:nth-child(1){background:#e2d3bd;opacity:.26;width:46vmax;height:46vmax;top:-22vmax;right:6vmax}
.bg i:nth-child(2){background:#d07a30;opacity:.5;width:50vmax;height:34vmax;bottom:-16vmax;left:12vmax}
.bg i:nth-child(3){background:#1f1611;opacity:.5;top:30%;left:2%;width:30vmax;height:30vmax}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 42%,transparent 48%,rgba(8,5,3,.6) 100%)}

/* --- jendela kaca besar (di belakang konten) --- */
.app{position:relative;gap:0;padding:var(--pad)}
.app::before{content:"";position:absolute;z-index:0;top:var(--pad);bottom:var(--pad);left:calc(var(--pad) + var(--sbw) - 12px);right:var(--pad);border-radius:36px;pointer-events:none;
 background:radial-gradient(80% 50% at 18% 0%,rgba(255,236,214,.16),transparent 70%),linear-gradient(170deg,rgba(128,112,100,.46),rgba(76,63,54,.52) 38%,rgba(54,43,36,.58));
 border:1px solid rgba(255,255,255,.13);-webkit-backdrop-filter:blur(46px) saturate(135%);backdrop-filter:blur(46px) saturate(135%);
 box-shadow:inset 0 1.5px 0 rgba(255,255,255,.26),inset 1px 0 0 rgba(255,255,255,.08),inset 0 -50px 90px -50px rgba(0,0,0,.4),0 70px 110px -50px rgba(0,0,0,.8),0 24px 44px -20px rgba(0,0,0,.55);
 transition:right .7s cubic-bezier(.22,.9,.3,1)}

/* --- panel kartu di dalam jendela --- */
.glass{padding:20px;border-radius:26px;border:1px solid rgba(255,255,255,.09);
 background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,0) 42%),rgba(22,17,14,.5);
 -webkit-backdrop-filter:blur(24px) saturate(130%);backdrop-filter:blur(24px) saturate(130%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -22px 34px -28px rgba(0,0,0,.55),0 20px 34px -22px rgba(0,0,0,.7)}
.glass::after{background:radial-gradient(300px circle at var(--mx,50%) var(--my,0%),rgba(255,236,214,.14),transparent 70%)}
.mdl{background:rgba(12,8,5,.55)}
.mdl .glass{background:linear-gradient(165deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 45%),rgba(48,38,32,.86)}

/* --- sidebar melayang, sedikit miring ke arah penonton --- */
.sbar{align-self:stretch;max-height:none;position:relative;z-index:3;margin-right:-12px;padding:20px 12px 16px;border-radius:32px;
 border:1px solid rgba(255,255,255,.15);
 background:linear-gradient(175deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 45%,rgba(255,255,255,.09)),rgba(84,72,64,.42);
 -webkit-backdrop-filter:blur(40px) saturate(140%);backdrop-filter:blur(40px) saturate(140%);
 box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -30px 50px -34px rgba(0,0,0,.35),0 40px 70px -26px rgba(0,0,0,.7),22px 0 40px -18px rgba(0,0,0,.45);
 transform:perspective(1500px) rotateY(5deg);transform-origin:100% 50%}
nav{flex:1 1 auto}
.sp{flex:1;min-height:8px;height:auto;margin:0;background:none}
nav button{font-size:13.5px}
.sbar{--mute:rgba(255,255,255,.8)}
html[data-theme="light"] .sbar{--mute:rgba(11,16,32,.64)}
.navlens b{background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.09));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.14),0 12px 26px -14px rgba(0,0,0,.55)}

/* --- area konten: menempel di jendela, memudar halus di tepi --- */
main{position:relative;z-index:2;padding:22px 26px 26px 40px;
 -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 12px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 12px),transparent 100%)}

/* --- tipografi --- */
h1{font-family:var(--serif);font-weight:400;font-size:36px;letter-spacing:-.015em;line-height:1.05}
.sub{font-size:13px}
.num,.big,.ctr b{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.num{font-size:36px;line-height:1}
.big{font-size:44px;line-height:1}
.ctr{padding:0 20px;text-align:center}
.ctr b{font-size:19px;line-height:1.1;max-width:100%;white-space:nowrap}
.ctr span{font-size:11px;white-space:nowrap}
.donut{align-items:center}
.dw{width:136px;height:136px;flex-shrink:0}
.hd{font-size:13px;font-weight:500;color:rgba(255,255,255,.8)}
.stat{gap:10px}

/* --- ikon, tombol, kontrol --- */
.ic2{width:32px;height:32px;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.ic2 svg{width:16px;height:16px;stroke:rgba(255,255,255,.88);stroke-width:1.8}
.btn:not(.pri),.chip2{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.btn:not(.pri){border-radius:12px;font-weight:500}
.seg{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07)}
.seg button.on{background:rgba(255,255,255,.15)}
.inp,.search,.ta{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.1)}
.toast{background:rgba(34,27,22,.84)}
.gmenu{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 55%,rgba(255,255,255,.09)),rgba(48,38,32,.68)}
.bar:hover::after{background:rgba(26,20,17,.92)}

/* --- chart batang: lavender-biru seperti di foto --- */
.bars .bar{border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,rgba(158,172,240,.95),rgba(98,112,200,.5));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.bars .bar.hi{background:linear-gradient(180deg,#bcc9ff,#6f86f0);box-shadow:0 0 26px rgba(120,140,255,.5),inset 0 1px 0 rgba(255,255,255,.55)}
.bars .bar:hover{filter:brightness(1.22)}

/* --- kolom kartu kanan: melayang di depan jendela, tebal seperti kaca --- */
.side .glass{--tx:#fff;--mute:rgba(255,255,255,.72);color:#fff;padding:22px;border-radius:32px;border:1px solid rgba(255,255,255,.16);
 box-shadow:inset 0 2px 0 rgba(255,255,255,.42),inset 2px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.06),inset 0 -36px 56px -38px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04),0 70px 90px -38px rgba(0,0,0,.85),0 28px 42px -18px rgba(0,0,0,.55),0 6px 12px -4px rgba(0,0,0,.35)}
.side .glass:nth-child(1){background:radial-gradient(130% 70% at 12% -4%,rgba(188,206,250,.95),transparent 60%),radial-gradient(90% 70% at 100% 100%,rgba(138,118,224,.6),transparent 65%),radial-gradient(70% 50% at 0% 100%,rgba(40,60,140,.55),transparent 70%),linear-gradient(165deg,#5b80d2,#4a66b6 55%,#5a70c0)}
.side .glass:nth-child(2){background:radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.12),transparent 60%),rgba(28,22,19,.82)}
.side .hd{color:rgba(255,255,255,.9);margin-bottom:10px}
.side .tag{background:rgba(255,255,255,.2);color:#fff}
.side .chip2{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.16)}
.side .big{font-size:52px}
.side .mini{height:108px;gap:11px;margin:22px 0 24px}
.side .mini .bar{border-radius:99px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.86));box-shadow:0 8px 16px -6px rgba(20,36,90,.55),inset 0 1px 0 #fff}
.side .mini .bar.hi{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.95),0 0 24px rgba(255,255,255,.3)}
.side .mini .bar:hover{filter:brightness(.9)}
.side .mini .bar::before{content:attr(data-t);position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:500;color:rgba(255,255,255,.8);pointer-events:none}
.side .spark{height:120px;margin-top:18px}
.side .spark .ln{stroke:#f6efe8;stroke-width:2.4}
.side .spark .ar{fill:rgba(255,255,255,.08)}

/* --- kedalaman tambahan: tepi cahaya jendela, bayangan lantai, grabber --- */
.app::before{box-shadow:inset 0 2px 0 rgba(255,255,255,.34),inset 2px 0 0 rgba(255,255,255,.1),inset -1px 0 0 rgba(255,255,255,.05),inset 0 -60px 100px -56px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04),0 90px 120px -50px rgba(0,0,0,.85),0 30px 50px -22px rgba(0,0,0,.6)}
.sbar{box-shadow:inset 0 2px 0 rgba(255,255,255,.36),inset 2px 0 0 rgba(255,255,255,.12),inset 0 -34px 56px -36px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04),0 50px 80px -28px rgba(0,0,0,.8),26px 0 44px -18px rgba(0,0,0,.5);transform:perspective(1300px) rotateY(7deg)}
.glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 1px 0 0 rgba(255,255,255,.05),inset 0 -24px 36px -28px rgba(0,0,0,.6),0 26px 40px -22px rgba(0,0,0,.75),0 4px 8px -3px rgba(0,0,0,.3)}
.lift:hover{transform:translateY(-6px) scale(1.01)}
.app::after{content:"";position:absolute;z-index:4;bottom:6px;left:calc(50% + 110px);width:130px;height:5px;margin-left:-65px;border-radius:9px;background:rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none}

/* --- tema terang versi desktop --- */
html[data-theme="light"] .bg{background:radial-gradient(70% 38% at 62% 4%,rgba(255,252,246,.9),transparent 70%),linear-gradient(180deg,#efe8de 0%,#ded3c4 40%,#d2b393 75%,#c79a6a 100%)}
html[data-theme="light"] .bg::after{background:radial-gradient(120% 100% at 50% 42%,transparent 55%,rgba(90,60,30,.22) 100%)}
html[data-theme="light"] .app::before{background:radial-gradient(80% 50% at 18% 0%,rgba(255,255,255,.7),transparent 70%),linear-gradient(170deg,rgba(255,255,255,.6),rgba(255,250,244,.48));border-color:rgba(255,255,255,.7);box-shadow:inset 0 1.5px 0 #fff,inset 0 -50px 90px -50px rgba(120,80,40,.18),0 60px 100px -50px rgba(80,50,20,.45),0 20px 40px -22px rgba(80,50,20,.3)}
html[data-theme="light"] .glass{background:linear-gradient(165deg,rgba(255,255,255,.72),rgba(255,255,255,.3) 50%),rgba(255,255,255,.3);border-color:rgba(255,255,255,.75);box-shadow:inset 0 1px 0 #fff,0 18px 30px -22px rgba(80,50,20,.4)}
html[data-theme="light"] .sbar{background:linear-gradient(175deg,rgba(255,255,255,.78),rgba(255,255,255,.4)),rgba(255,255,255,.25)}
html[data-theme="light"] .side .glass{border-color:rgba(255,255,255,.3);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 50px 70px -34px rgba(60,40,20,.55),0 18px 30px -16px rgba(60,40,20,.35)}
html[data-theme="light"] .hd{color:var(--tx)}
html[data-theme="light"] .side .hd{color:rgba(255,255,255,.9)}
html[data-theme="light"] .ic2{background:rgba(20,30,60,.07);border-color:rgba(20,30,60,.1)}
html[data-theme="light"] .ic2 svg{stroke:#3a2e24}
html[data-theme="light"] .gmenu{background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,.55)),rgba(255,255,255,.55)}
}

/* --- layar desktop lebar: kolom kartu kanan keluar dari jendela, melayang di depan dan tetap diam saat konten digulir --- */
@media (min-width:981px){
:root{--sw:clamp(250px,21vw,320px);--pr:22px}
.app:has(.pg .side)::before{right:calc(var(--pad) + var(--pr) + var(--sw) + 18px)}
.app:has(.pg .side)::after{left:calc(50% + 94px - var(--sw)/2 - var(--pr)/2)}
main:has(.pg .side){padding-right:var(--pr);
 -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 12px),transparent 100%),linear-gradient(90deg,#000 calc(100% - var(--pr)),transparent 100%);
 -webkit-mask-composite:source-in;mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 12px),transparent 100%),linear-gradient(90deg,#000 calc(100% - var(--pr)),transparent 100%);mask-composite:intersect}
.pg:has(.wrap>.side){display:grid;grid-template-columns:minmax(0,1fr) var(--sw);column-gap:44px;align-items:start}
.pg:has(.wrap>.side)>.top,.pg:has(.wrap>.side)>.row,.pg:has(.wrap>.side)>.wrap>div:first-child{grid-column:1}
.pg:has(.wrap>.side)>.wrap{display:contents}
.pg:has(.wrap>.side)>.wrap>.side{grid-column:2;grid-row:1/span 3;margin-top:-12px;position:sticky;top:10px;gap:18px;
 transform:perspective(1800px) translateZ(30px) rotateY(-5deg);transform-origin:0 40%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

:where(button,a,[role=button],[tabindex],summary,select,textarea):focus-visible{outline:2px solid #0a84ff!important;outline-offset:2px!important}
</style>
<style>

<style>
/* ===== v4 desktop: jarak ke bingkai & jarak antar panel mengikuti foto (hanya tampilan, tanpa ubah fungsi) ===== */
@media (min-width:761px){
:root{--pt:clamp(16px,3.4vh,38px);--pb:clamp(34px,7.2vh,66px);--pl:clamp(26px,6.5vw,128px);--prf:clamp(24px,5vw,96px);--sbw:clamp(212px,14.6vw,264px);--gs:4px;--gr:clamp(12px,1.8vw,26px)}
.app{gap:var(--gs);padding:var(--pt) var(--prf) var(--pb) var(--pl)}
.app::before{top:var(--pt);bottom:var(--pb);left:calc(var(--pl) + var(--sbw) + var(--gs));right:var(--prf)}
.sbar{width:var(--sbw);margin-right:0}
main{padding:22px 26px 26px 28px}
.app::after{bottom:calc(var(--pb)/2 - 3px);left:calc((var(--pl) + var(--sbw) + var(--gs) + 100% - var(--prf))/2)}
}
@media (min-width:981px){
.app:has(.pg .side){padding-right:calc(var(--prf) - var(--pr))}
.app:has(.pg .side)::before{right:calc(var(--prf) + var(--sw) + var(--gr))}
.app:has(.pg .side)::after{left:calc((var(--pl) + var(--sbw) + var(--gs) + 100% - var(--prf) - var(--sw) - var(--gr))/2)}
.pg:has(.wrap>.side){column-gap:calc(var(--gr) + var(--pr))}
.pg:has(.wrap>.side)>.wrap>.side{gap:clamp(10px,1.1vw,16px)}
}
</style>
<style>
/* ===== Panel kanan bisa digulir sendiri & tampil di semua menu ===== */

.pg:has(.wrap.gw)>.wrap>.side{grid-row:1/span 2!important}
.pg:has(.wrap>.side)>.wrap>.side{max-height:calc(100vh - var(--pt,18px) - var(--pb,18px) - 28px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22px,#000 calc(100% - 34px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 22px,#000 calc(100% - 34px),transparent 100%);padding:22px 16px 48px;margin-left:-16px;margin-right:-16px;margin-top:-34px;-webkit-overflow-scrolling:touch}

}

/* layar penuh: isi seluruh jendela di semua perangkat */
html,body{width:100%;min-height:100vh;min-height:100dvh}

</style>
<style>
/* ===== TAMPILAN MOBILE KHUSUS (<=760px). Desktop (>=761px) tidak tersentuh. ===== */
.mtop,.mbar,.msheet{display:none}
@media (max-width:760px){
 :root{--mtop:56px;--mbar:64px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
 html,body{overflow:hidden;overscroll-behavior:none}
 .bg i{animation:none;filter:blur(60px)}
 .app{display:block;padding:0;height:100dvh;min-height:0}
 .sbar{display:none!important}
 /* header */
 .mtop{display:flex;align-items:center;gap:12px;position:fixed;left:0;right:0;top:0;z-index:35;height:calc(var(--mtop) + var(--sat));padding:var(--sat) 16px 0;background:linear-gradient(180deg,rgba(8,10,18,.82),rgba(8,10,18,.5));-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--edge)}
 .mlogo{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#ff8a3d,#ff4f9a)}
 .mlogo img{width:100%;height:100%;object-fit:cover;display:block}
 .mtt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
 .mtt b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .mtt span{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .mst{display:flex;align-items:center}
 .mbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--edge);background:rgba(255,255,255,.08)}
 .mbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
 .mbtn.spin svg{animation:mspin .9s linear}
 @keyframes mspin{to{transform:rotate(360deg)}}
 /* konten */
 main{position:absolute;inset:0;padding:calc(var(--mtop) + var(--sat) + 14px) 14px calc(var(--mbar) + var(--sab) + 28px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
 .pg{animation:enter .45s var(--sp) both}
 .top{display:none}
 .row{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
 .col,.two,.pair,.wrap,.wrap.gw{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}

<script>
/* presence.js v2
   Sesi per perangkat, status online, last seen, logout perangkat lain (segera).
   Struktur di server (WebDAV, relatif terhadap halaman):
     RADEN/sessions/<email>__<device>.json  -> satu file per perangkat yang sedang login
     RADEN/presence/<email>.json            -> last seen per user
   Perubahan:
   - MKCOL dibuat per tingkat folder (RADEN/, lalu RADEN/sessions/); PUT diulang setelah folder dibuat.
   - Pemeriksaan pencabutan setiap 3 detik. Tab di browser yang sama menerima pencabutan seketika (event storage).
   - EPOCH: bila nilai berubah, semua perangkat wajib login ulang.
*/
(function (g) {
  "use strict";

  var EPOCH = "relogin-2";           // ganti nilai ini untuk memaksa semua perangkat login ulang
  var CFG = {
    base: "RADEN/sessions/",
    users: "RADEN/presence/",

  var lastErr = "";

    if (/iPad/.test(ua)) return "iPad";
    if (/Android/.test(ua)) return "Android";
    if (/Windows/.test(ua)) return "Windows";
    if (/Macintosh|Mac OS/.test(ua)) return "Mac";
    if (/Linux/.test(ua)) return "Linux";
    return "Perangkat";

  function fileName(email, dev) {
    return email.replace(/[^a-z0-9._-]/g, "_") + "__" + dev + ".json";
  }

  function dirOf(url) { return url.slice(0, url.lastIndexOf("/") + 1); }

  // Membuat setiap tingkat folder: RADEN/ lalu RADEN/sessions/ (405 = sudah ada, diabaikan)
  function mkcolPath(dir) {
    var u = new URL(dir, location.href);
    var parts = u.pathname.split("/").filter(Boolean), cur = "/", chain = Promise.resolve();

      cur += p + "/";
      var target = u.origin + cur;
      chain = chain.then(function () {
        return _fetch(target, { method: "MKCOL", cache: "no-store" }).catch(function () {});
      });

  function put(url, obj, keep) {
    var body = JSON.stringify(obj);
    function send() {
      return _fetch(url, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: body,
        cache: "no-store",
        keepalive: !!keep

    }
    return send().then(function (r) {
      if (r.ok) return r;
      return mkcolPath(dirOf(url)).then(send);   // folder belum ada: buat lalu ulangi
    }).then(function (r) {
      lastErr = r.ok ? "" : "PUT " + url + " → HTTP " + r.status;
      return r;
    });
  }

  // null bila file tidak ada (404)
  function getJson(url) {
    return _fetch(url, { cache: "no-store" }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function listNames(dir) {
    return _fetch(dir, { method: "PROPFIND", headers: { Depth: "1" }, cache: "no-store" })
      .then(function (r) {

        lastErr = ""; return r.text();

      .then(function (t) {

    var url = sessDir() + me.file;
    getJson(url).then(function (rec) {
      if (!me) return;

        return put(url, me.rec).then(function (r) {
          if (r.ok && me) { me.confirmed = true; }
        });
      }
      if (!rec || rec.revoked) { stop(true); return; }   // dihapus / dicabut dari perangkat lain
      if (Date.now() - lastBeat >= CFG.beatMs) {

      .then(function () { busy = false; });

  function offline() {
    if (!me) return;
    me.rec.seen = 0;
    put(sessDir() + me.file, me.rec, true);
    put(usrDir() + me.email + ".json", { email: me.email, lastSeen: Date.now() }, true);
  }

  function onStorage(e) {
    if (!me || e.key !== KKICK || !e.newValue) return;
    try { if (JSON.parse(e.newValue).file === me.file) stop(true); } catch (err) {}
  }

  function start(email, name, onRevoked) {
    email = low(email);
    if (!email) return Promise.resolve(false);
    stop(false);
    var now = Date.now(), dev = deviceId();
    me = {
      email: email,
      file: fileName(email, dev),
      confirmed: false,
      rec: { email: email, name: String(name || email), device: dev, deviceName: deviceName(),
             ua: navigator.userAgent, started: now, seen: now, revoked: false }
    };

    onRevokeCb = typeof onRevoked === "function" ? onRevoked : null;
    if (!hooked) {
      hooked = true;
      addEventListener("pagehide", offline);
      addEventListener("storage", onStorage);
    }
    timer = setInterval(check, CFG.checkMs);
    return ready().then(function () { return mkcolPath(sessDir()); })
      .then(function () { return mkcolPath(usrDir()); })
      .then(function () { return put(sessDir() + me.file, me.rec); })
      .then(function (r) {
        if (me && r.ok) me.confirmed = true;
        return put(usrDir() + email + ".json", { email: email, lastSeen: now });
      })
      .then(function () { return !!(me && me.confirmed); })
      .catch(function () { return false; });
  }

  // notify = true bila dicabut dari perangkat lain (dipanggil onRevoked)
  function stop(notify) {
    clearInterval(timer); timer = null;
    var cb = onRevokeCb;
    if (me && !notify) {
      put(usrDir() + me.email + ".json", { email: me.email, lastSeen: Date.now() }, true);
      _fetch(sessDir() + me.file, { method: "DELETE", keepalive: true, cache: "no-store" }).catch(function () {});
    }

  function list() {
    return ready().then(function () { return listNames(sessDir()); }).then(function (names) {
      return Promise.all(names.map(function (n) {

        });

          file: fileName(r.email, r.device), seen: r.seen || 0, online: online

    return ready().then(function () { return listNames(usrDir()); }).then(function (names) {

      }));

const DN_GAP=2,DN_MIN=3,DN_C=2*Math.PI*54;
/* items: [nama, persen, warna, nilai]. Segmen kecil dibuat minimal terlihat; semua segmen dan baris legend saling terhubung lewat data-dk */
function donut(items,center,sub){
 const C=DN_C,n=items.length;
 let len=items.map(s=>Math.max(s[1]/100*C,DN_MIN));
 const sum=len.reduce((a,b)=>a+b,0)||1,room=Math.max(0,C-DN_GAP*n);
 len=len.map(l=>l/sum*room);
 let a=0;
 const arcs=items.map((s,k)=>{const x=`<circle cx="68" cy="68" r="54" stroke="${s[2]}" stroke-dasharray="${len[k].toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-a).toFixed(2)}" data-dk="${k}"/>`;a+=len[k]+DN_GAP;return x}).join('');
 const legend=items.map((s,k)=>{const p=s[1]<1?'<1%':Math.round(s[1])+'%';return `<div data-dk="${k}" data-p="${p}" data-n="${s[0]}" tabindex="0"><i style="background:${s[2]}"></i><span class="lt2"><span class="ln">${s[0]}</span><b>${s[3]}</b></span></div>`}).join('');
 return `<div class="donut"><div class="dw"><svg viewBox="0 0 136 136"><circle cx="68" cy="68" r="54" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/><g transform="rotate(-90 68 68)" fill="none" stroke-width="14">${arcs}</g></svg><div class="ctr" data-c="${center}" data-s="${sub}"><b>${center}</b><span>${sub}</span></div></div><div class="leg">${legend}</div></div>`}

function dnHot(el,k){
 const d=el.closest('.donut');if(!d)return;
 d.querySelectorAll('[data-dk]').forEach(x=>x.classList.toggle('hot',k!=null&&x.dataset.dk===String(k)));
 const c=d.querySelector('.ctr');if(!c)return;
 const b=c.querySelector('b'),sp=c.querySelector('span');
 if(k==null){b.textContent=c.dataset.c;sp.textContent=c.dataset.s}
 else{const li=d.querySelector('.leg [data-dk="'+k+'"]');if(li){b.textContent=li.dataset.p;sp.textContent=li.dataset.n}}
}
const dnOf=t=>t&&t.closest?t.closest('.donut [data-dk]'):null;
document.addEventListener('pointerover',e=>{const t=dnOf(e.target);if(t)dnHot(t,+t.dataset.dk)});
document.addEventListener('pointerout',e=>{const t=dnOf(e.target);if(t&&!dnOf(e.relatedTarget))dnHot(t,null)});
document.addEventListener('focusin',e=>{const t=dnOf(e.target);if(t)dnHot(t,+t.dataset.dk)});
document.addEventListener('focusout',e=>{const t=dnOf(e.target);if(t)dnHot(t,null)});

}

const lc=s=>String(s||'').toLowerCase();
function aliasOf(u){
 const e=lc(u.e),a=new Set([e,e.split('@')[0],lc(u.un),lc(u.n).replace(/\s+/g,''),lc(u.n).replace(/\s+/g,'-'),lc(u.n).replace(/\s+/g,'_')]);
 (u.folders||[]).forEach(x=>a.add(lc(x).replace(/^\/+|\/+$/g,'')));
 a.delete('');return a}
/* pemakaian tiap user dihitung dari hasil pindai server: file di folder yang namanya cocok dengan user (username, email, nama, atau folder yang diatur di Edit) */
function usageMap(){
 const S=SRV.sum,res=USERS.map(()=>({b:0,f:new Set()}));
 if(!S||!S.dsz)return{res,other:0,ok:false};
 const al=USERS.map(aliasOf);let other=0;
 for(const d in S.dsz){
  const bytes=S.dsz[d],path='/'+lc(d)+'/';let best=-1,bi=-1,bn='';
  al.forEach((set,i)=>{for(const a of set){const ix=path.lastIndexOf('/'+a+'/');if(ix>best){best=ix;bi=i;bn=a}}});
  if(bi>=0){res[bi].b+=bytes;res[bi].f.add(bn)}else other+=bytes;
 }
 return{res,other,ok:true}}

 return rows.join('')};

async function copyTree(src,dst,isDir){

  if(!g.ok)return{ok:false,msg:fmWhy(g.status)};
  const b=await g.blob(),st=await dav('PUT',dst,{'Content-Type':b.type||'application/octet-stream'},b);
  return okc(st)?{ok:true}:{ok:false,msg:fmWhy(st)}}

 const self=src.replace(/\/$/,'');
 for(const c of l){if(c.href.replace(/\/$/,'')===self)continue;
  const r=await copyTree(itemU(c),childU(dst,c.name,c.dir),c.dir);if(!r.ok)return r}

async function moveItem(x,destBase,newName){

 if(!WDC.noMove&&!(WDC.allow&&!WDC.allow.includes('MOVE'))){
  const st=await dav('MOVE',src,{Destination:dst,Overwrite:'F'});
  if(okc(st))return{ok:true};
  if(![0,400,405,501,502].includes(st))return{ok:false,msg:fmWhy(st)};

/* periksa satu file: harus ada (HTTP 200) dan memuat penanda penjaga akses (4 KB pertama), seperti di login.html */
async function probeHome(url,expect){
 const ctl=typeof AbortController==='function'?new AbortController():null;
 try{
  const r=await fetch(url,{cache:'no-store',signal:ctl?ctl.signal:undefined});
  if(!r.ok)return 'hilang';
  let t='';
  if(r.body&&r.body.getReader&&typeof TextDecoder==='function'){
   const rd=r.body.getReader(),dec=new TextDecoder();
   while(t.length<4096){const x=await rd.read();if(x.value)t+=dec.decode(x.value,{stream:true});if(x.done)break}
   if(ctl)try{ctl.abort()}catch(e){}
  }else t=await r.text();
  return !expect||t.indexOf(expect)>-1?true:'isi';
 }catch(e){return 'hilang'}
}

/* ===== Upload file (semua jenis) ke folder yang sedang dibuka ===== */
const UP={queue:[],n:0};
function uploadFiles(files){
 const dir=BR.url||srvURL();
 if(!dir){toast('Path server belum valid');return}
 const existing=new Set(BR.list.filter(x=>!x.dir).map(x=>x.name));
 (async()=>{for(const f of [...files]){
  const over=existing.has(f.name);
  if(over&&!(await confirmAny(LANG==='en'?`"${f.name}" already exists in this folder. Overwrite?`:`"${f.name}" sudah ada di folder ini. Timpa file?`)))continue;
  putFile(dir,f,over);
 }
})();
}
function putFile(dir,f,over){
 const row={id:++UP.n,name:f.name,pct:0,st:'Mengunggah…',ok:null};
 UP.queue.unshift(row);renderUploads();
 const url=dir+encodeURIComponent(f.name);
 const send=(method,u,body,type)=>new Promise(res=>{
  const x=new XMLHttpRequest();x.open(method,u,true);if(type)x.setRequestHeader('Content-Type',type);
  x.upload.onprogress=e=>{if(e.lengthComputable){row.pct=Math.round(e.loaded/e.total*100);renderUploads()}};
  x.onload=()=>res(x.status);x.onerror=x.ontimeout=()=>res(0);x.send(body)});
 const good=c=>c>=200&&c<300;
 return (async()=>{
  wlOn();
  let st=await send('PUT',url,f,f.type||'application/octet-stream');
  for(let r=0;st===0&&r<2;r++){row.st=tt('Koneksi putus, mencoba lagi…','Connection lost, retrying…');row.pct=0;renderUploads();await new Promise(z=>setTimeout(z,2000*(r+1)));st=await send('PUT',url,f,f.type||'application/octet-stream')}
  if(st===404||st===409){await mkdirs(dir);st=await send('PUT',url,f,f.type||'application/octet-stream')}
  if(!good(st)&&st!==0&&st!==413&&st!==507){
   if(over){try{await fetch(url,{method:'DELETE',cache:'no-store'})}catch(e){}}
   const fd=new FormData();fd.append('file',f,f.name);row.pct=0;
   st=await send('POST',dir,fd,null);
  }
  const ok=good(st);row.ok=ok;row.pct=ok?100:row.pct;
  row.st=ok?'Berhasil · '+fmtB(f.size):(st?'Gagal · HTTP '+st:'Gagal · server tidak terjangkau');
  renderUploads();
  if(ok){bumpUpload(f,over);if(BR.url===dir)browse(dir)}
  if(!UP.queue.some(r=>r.ok===null))wlOff();
  return ok;
 })();
}

}

const WDC={allow:null,dav:'',noMove:false};

const fixU=u=>{try{const o=new URL(u);if(location.protocol==='https:'&&o.protocol==='http:'&&o.hostname===location.hostname)o.protocol='https:';return o.href}catch(e){return u}};
const IQ={db:null,run:false};
function iqOpen(){return new Promise(res=>{if(IQ.db)return res(IQ.db);try{const r=indexedDB.open('rd-upq',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>{IQ.db=r.result;res(IQ.db)};r.onerror=()=>res(null)}catch(e){res(null)}})}
async function iqTx(mode,fn){const db=await iqOpen();if(!db)return null;return new Promise(res=>{try{const t=db.transaction('q',mode),rq=fn(t.objectStore('q'));t.oncomplete=()=>res(rq&&rq.result!==undefined?rq.result:true);t.onerror=t.onabort=()=>res(null)}catch(e){res(null)}})}
const iqAdd=(dir,file)=>iqTx('readwrite',s=>s.add({dir,file,n:0,t:Date.now()}));
const iqDel=id=>iqTx('readwrite',s=>s.delete(id));
const iqPut=o=>iqTx('readwrite',s=>s.put(o));
const iqClear=()=>iqTx('readwrite',s=>s.clear());
const iqAll=()=>iqTx('readonly',s=>s.getAll()).then(r=>Array.isArray(r)?r:[]);
async function iqStat(){const el=$('#iqstat');if(!el)return;const n=(await iqAll()).length;
 el.innerHTML=n?`⏳ ${n} ${tt('file belum terkirim, tersimpan aman di perangkat dan dilanjutkan otomatis saat server terhubung.','files not yet sent, stored safely on this device and resumed automatically when the server is connected.')} <button class="chip2" data-act="iqgo">${tt('Lanjutkan sekarang','Resume now')}</button> <button class="chip2 dng" data-act="iqclr">${tt('Kosongkan','Clear')}</button>`:''}
async function iqResume(manual){
 if(IQ.run||(!manual&&!lastOk)||UP.queue.some(r=>r.ok===null))return;
 const all=(await iqAll()).filter(o=>manual||o.n<5);if(!all.length){iqStat();return}

 let i=0,good=0;const w=async()=>{while(i<all.length){const o=all[i++];if(await putFile(fixU(o.dir),o.file,false)){good++;await iqDel(o.id)}else{o.n=manual?1:o.n+1;await iqPut(o)}}};
 await Promise.all([w(),w(),w()]);IQ.run=false;iqStat();

/* ===== Impor Foto: tujuan = folder server (dipilih dari server), susunan tahun/bulan mengikuti server ===== */
const IMP={get dest(){const d=CFG.impDest;return d==null?'':d},mode:null,state:''};
const impClean=s=>s.trim().replace(/[\\:*?"<>|]/g,'_');
const impSegs=()=>(IMP.dest||'').replace(/\\/g,'/').split('/').map(impClean).filter(x=>x&&x!=='.'&&x!=='..');
const impEnc=a=>a.map(x=>encodeURIComponent(x)+'/').join('');

const impCoarse=()=>innerWidth<=760&&!matchMedia('(hover:hover) and (pointer:fine)').matches;

async function impList(url){ /* isi langsung sebuah folder (tanpa folder itu sendiri) */
 const it=await propfind(url);let me='';try{me=decodeURIComponent(new URL(url).pathname).replace(/\/$/,'')}catch(e){}
 return it.filter(x=>x.p.replace(/\/$/,'')!==me)}
/* Deteksi susunan yang dipakai server: tahun/bulan, tahun saja, atau langsung di folder */
async function impAlign(){
 const root=srvURL();if(!root)return;const segs=impSegs(),out=[];let cur=root;
 for(let i=0;i<segs.length;i++){
  let kids;try{kids=await impList(cur)}catch(e){return}
  const hit=kids.find(x=>x.dir&&x.name===segs[i])||kids.find(x=>x.dir&&x.name.toLowerCase()===segs[i].toLowerCase());
  if(!hit){out.push(...segs.slice(i));break}
  out.push(hit.name);cur=hit.href}
 const nd=out.join('/');
 if(out.length&&nd!==(CFG.impDest||'')){CFG.impDest=nd;saveCfg()}}
async function impDetect(){
 await impAlign();
 const base=impBase();if(!base)return IMP.mode||'ym';

async function impUpload(files,dirMode){
 const base=impBase();if(!base){toast(tt('Path server belum valid','Server path is not valid'));return}
 const list=[...files];if(!list.length)return;
 const mode=await impDetect(); /* susunan dibaca langsung dari server saat unggah */
 const groups=new Map();
 for(const f of list){
  let sub='';
  if(dirMode&&f.webkitRelativePath){const q=f.webkitRelativePath.split('/');q.pop();sub=q.map(impClean).filter(x=>x&&x!=='.'&&x!=='..').map(encodeURIComponent).join('/')}
  else if(mode!=='flat'&&f.lastModified){const d=new Date(f.lastModified);sub=mode==='y'?String(d.getFullYear()):d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')}
  const dir=base+(sub?sub+'/':'');
  if(!groups.has(dir))groups.set(dir,[]);groups.get(dir).push(f)}
 const jobs=[];let skip=0;
 for(const [dir,fs] of groups){
  const names=new Map();
  try{(await propfind(dir)).forEach(x=>names.set(x.name,x.size))}catch(e){}
  const taken=new Set(names.keys());
  for(const f of fs){
   if(names.has(f.name)&&names.get(f.name)===f.size){skip++;continue}
   const nn=uniqName(f.name,false,taken);taken.add(nn);
   jobs.push([dir,nn===f.name?f:new File([f],nn,{type:f.type,lastModified:f.lastModified})])}}
 if(!jobs.length){toast(tt(`Semua ${skip} file sudah ada di server`,`All ${skip} files are already on the server`));return}
 toast(tt(`Mengunggah ${jobs.length} file…`,`Uploading ${jobs.length} files…`));
 IQ.run=true;
 for(const j of jobs)j.push(await iqAdd(j[0],j[1]));
 let i=0,good=0;const worker=async()=>{while(i<jobs.length){const j=jobs[i++];if(await putFile(j[0],j[1],false)){good++;if(j[2])await iqDel(j[2])}}};
 await Promise.all([worker(),worker(),worker()]);
 IQ.run=false;iqStat();
 toast(tt(`${good} dari ${jobs.length} file tersimpan di server`,`${good} of ${jobs.length} files saved to the server`)+(skip?` · ${skip} ${tt('dilewati','skipped')}`:''));
 if(CUR==='Impor Foto')impSync();
}

 function drawGal(gal,alpha,dt,rot,u,sc,period,kMax,kMaxY){

<script>
/* LL — lensa liquid glass dengan pegas (fisika yang sama dengan bar bawah & sidebar).
   Pemakaian: elemen induk memakai data-ll="<id unik>" dan data-ll-item="<selector item>".
   Item yang punya kelas .on adalah item aktif. Lensa bergerak saat ditekan dan memakai pegas. */
const LL = (function () {
  const ST = {};
  let scanQ = 0;

  function ensure(host) {
    if (host.dataset.llm) return;
    host.dataset.llm = '1';
    const id = host.dataset.ll, sel = host.dataset.llItem || 'button';
    if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
    const lens = document.createElement('i');
    lens.className = 'llens'; lens.setAttribute('aria-hidden', 'true'); lens.innerHTML = '<b></b>';
    host.prepend(lens);
    const b = lens.firstElementChild;
    const S = ST[id] || (ST[id] = { x: 0, y: 0, vx: 0, vy: 0, sc: 1, vsc: 0, tx: 0, ty: 0, tsc: 1, W: 0, H: 0, set: false });
    let raf = 0, tm = 0;

    function paint() {
      const v = Math.abs(S.vx), sx = 1 + Math.min(.14, v / 2400), sy = 1 - (sx - 1) * .5;
      lens.style.transform = 'translate3d(' + S.x.toFixed(2) + 'px,' + S.y.toFixed(2) + 'px,0)';
      b.style.transform = 'scale(' + (S.sc * sx).toFixed(4) + ',' + (S.sc * sy).toFixed(4) + ')';
    }
    function tick(ts) {
      raf = 0;
      if (!host.isConnected) return;               // host sudah diganti saat render ulang
      const dt = Math.min(.05, Math.max(.001, (ts - (tm || ts - 16.7)) / 1000)); tm = ts;
      const k = K();
      const a = springK(S, 'x', 'vx', S.tx, dt, k.w, k.z);
      const c = springK(S, 'y', 'vy', S.ty, dt, k.w, k.z);
      const d = springK(S, 'sc', 'vsc', S.tsc, dt, SPR.POP.w, SPR.POP.z, .0008, .02);
      paint();
      if (!(a && c && d)) raf = requestAnimationFrame(tick); else tm = 0;
    }
    function kick() { if (!raf) { tm = 0; raf = requestAnimationFrame(tick); } }
    function size(el) {
      if (S.W !== el.offsetWidth || S.H !== el.offsetHeight) {
        S.W = el.offsetWidth; S.H = el.offsetHeight;
        lens.style.width = S.W + 'px'; lens.style.height = S.H + 'px';
      }
      lens.style.borderRadius = getComputedStyle(el).borderRadius;
      if (typeof FX !== 'undefined' && FX && typeof applyLensEl === 'function') applyLensEl(lens);
    }
    function to(el) {
      if (!el || !el.offsetWidth) return;
      size(el);
      S.tx = el.offsetLeft; S.ty = el.offsetTop;
      if (!S.set) { S.x = S.tx; S.y = S.ty; S.set = true; paint(); }   // posisi awal: langsung
      else kick();                                                      // pindah: pegas dari posisi sekarang
    }
    const bounce = host.dataset.llSpring === 'bounce';   // tab pengaturan: pegas sedikit memantul (iOS 26)
    const K = () => bounce ? { w: SPR.SETTLE.w * 1.15, z: .72 } : SPR.SETTLE;
    const items = () => [...host.querySelectorAll(sel)];
    const active = () => items().find(x => x.classList.contains('on') || x.dataset.llOn === '1');

    host.addEventListener('pointerdown', function (e) {
      const el = e.target.closest && e.target.closest(sel);
      if (!el || !host.contains(el)) return;
      to(el); S.tsc = 1.06; kick();
    });
    const release = function () { S.tsc = 1; kick(); };
    host.addEventListener('pointerup', release);
    host.addEventListener('pointercancel', release);
    host.addEventListener('pointerleave', release);
    window.addEventListener('resize', function () { to(active()); });

    host._llMove = function () { to(active()); };
    requestAnimationFrame(function () { to(active()); });
  }

  function scan() {
    scanQ = 0;
    document.querySelectorAll('[data-ll]:not([data-llm])').forEach(ensure);
  }
  function queue() { if (!scanQ) scanQ = requestAnimationFrame(scan); }

  return { move: function (h) { if (h && h._llMove) h._llMove(); }, scan: scan, start: function () {
    queue();
    new MutationObserver(queue).observe(document.body, { childList: true, subtree: true });
  } };
})();

LL.start();
</script>

.r{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:44px;position:relative;cursor:default}
.r.k{cursor:pointer}.r.k:active{background:rgba(120,120,128,.18)}
.r+.r::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.r.hi+.r::before,.r.hi::before{left:60px}
.ic{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;flex:none}
.tx{flex:1;min-width:0;padding:11px 0}
.tx small{display:block;color:var(--tx2);font-size:13px;margin-top:1px}
.tx.red{color:var(--red)}.tx.ac{color:var(--ac)}
.v{color:var(--tx2);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch{color:#c4c4c7;font-size:20px;margin-left:-4px}
.r input.in{border:0;background:0;color:var(--tx2);font:inherit;text-align:right;outline:0;width:58%;min-width:0}
.sw{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--grn)}.sw.on::after{transform:translateX(20px)}
.ck{color:var(--ac);font-weight:700}
input[type=range]{flex:1;accent-color:var(--ac)}
.prof{padding:12px 16px;min-height:80px}
.av{width:60px;height:60px;border-radius:50%;background:linear-gradient(#a0a5b0,#6f7480);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.prof .av{overflow:visible;background:none}.av img{width:100%;height:100%;object-fit:contain;display:block}.brandfx{animation:lgBreathe 3.4s ease-in-out infinite;transform-origin:50% 50%}@keyframes lgBreathe{0%,100%{transform:scale(.92);filter:drop-shadow(0 4px 8px rgba(60,20,140,.35))}50%{transform:scale(1.08);filter:drop-shadow(0 8px 16px rgba(124,58,237,.55))}}.prof .tx{padding:0}.prof .tx b{font-size:20px;font-weight:400}
.bar{height:22px;border-radius:6px;background:rgba(120,120,128,.18);overflow:hidden;display:flex;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--ac)}
.blk{padding:12px 16px;display:block}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(60,60,67,.95);color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:.3s;z-index:20;max-width:90%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:30}
.dlg-bg.show{display:flex}
.dlg{background:var(--card);width:270px;border-radius:14px;text-align:center;overflow:hidden}
.dlg p{margin:0;padding:18px 16px 14px}.dlg p b{display:block;margin-bottom:4px}.dlg p span{font-size:13px}
.dlg input{width:calc(100% - 32px);margin:0 16px 14px;padding:7px;border:1px solid var(--sep);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.dlg .bt{display:flex;border-top:.5px solid var(--sep)}
.dlg .bt button{flex:1;padding:12px;border:0;background:0;color:var(--ac);font:inherit;cursor:pointer}
.dlg .bt button+button{border-left:.5px solid var(--sep);font-weight:600}
.dlg .bt button.d{color:var(--red)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--tx2);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

:root{--bg:#2a0d0a;--card:rgba(255,255,255,.08);--tx:#f6f8ff;--tx2:rgba(232,238,255,.62);--sep:rgba(255,255,255,.12);--ac:#0a84ff;--bar:rgba(42,13,10,.85);--dlgbg:#3d1c17;--pt0:70px;--pb:110px;color-scheme:dark}
:root[data-t=dark]{--bg:#2a0d0a;--card:rgba(255,255,255,.08);--tx:#f6f8ff;--tx2:rgba(232,238,255,.62);--sep:rgba(255,255,255,.12);--bar:rgba(42,13,10,.85);--dlgbg:#3d1c17;color-scheme:dark}
:root[data-t=light]{--bg:#f3d9d2;--card:rgba(255,255,255,.78);--tx:#0a1128;--tx2:rgba(16,26,56,.6);--sep:rgba(20,40,100,.12);--bar:rgba(243,217,210,.85);--dlgbg:#fff;color-scheme:light}
html,body{background:var(--bg)}
.nav{padding-top:var(--pt0)}
.body{padding:calc(var(--pt0) + 44px) 16px var(--pb)}
.pane{background:var(--bg)}
.dlg{background:var(--dlgbg)}
.r.k:active{background:rgba(120,120,128,.22)}
:root[data-t=light]{--bg:#f6e3dc;--card:rgba(255,255,255,.9);--tx:#1c1233;--tx2:rgba(44,30,66,.62);--sep:rgba(70,34,52,.12);--bar:rgba(246,227,220,.88);--ac:#0a6cff;--dlgbg:#fff}
:root[data-t=light] .pane{background:linear-gradient(180deg,#fbeee8,#f4dcd5)}
:root[data-t=light] .g{box-shadow:0 10px 26px -16px rgba(120,52,46,.35),inset 0 0 0 .5px rgba(255,255,255,.95)}
:root[data-t=light] .sr{background:rgba(255,255,255,.7)}
:root[data-t=light] .sw{background:rgba(70,34,52,.18)}:root[data-t=light] .sw.on{background:var(--grn)}.acc{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}.acc-b{background:none;border:0;display:grid;justify-items:center;gap:5px;padding:4px 2px;color:var(--tx2);font:inherit;font-size:12px;cursor:pointer}.acc-b i{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 2px var(--bg)}.acc-b.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 4.5px var(--ac,#0a84ff)}.acc-b.on{color:var(--tx)}
#accBtn.on{background:rgba(52,199,89,.42);border-color:rgba(52,199,89,.7)}
#accBtn.on svg{color:#fff}
</style>
</head>
<style id="gd-skin">
:root[data-t],:root[data-t=dark],:root[data-t=light]{--bg:transparent;--card:rgba(255,255,255,.08);--tx:#f4f5f8;--tx2:rgba(244,245,248,.6);--sep:rgba(255,255,255,.12);--ac:#8fb1ff;--bar:rgba(20,22,32,.5);--grn:#3ddc97;--red:#ff7b7b;--dlgbg:rgba(24,26,38,.88);color-scheme:dark}
html,body{background:transparent!important}
#app,.pane{background:transparent!important}
.nav.sc{-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border-bottom:1px solid rgba(255,255,255,.1)}
.g{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:20px;-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 12px 32px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.14)}
.r{min-height:52px}
.r+.r{border-top:1px solid rgba(255,255,255,.08)}
.ic{box-shadow:0 4px 12px rgba(0,0,0,.25)}
.lt{font-size:30px;font-weight:700;letter-spacing:-.02em}
.gh{font-weight:600;letter-spacing:.06em;color:rgba(244,245,248,.6)}
.gf{color:rgba(244,245,248,.5)}
.sw{background:rgba(255,255,255,.18)}
.sw.on{background:linear-gradient(135deg,#3ddc97,#5b8cff)}
.dlg{background:var(--dlgbg);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.14);border-radius:20px}
.dlg .bt{border-top:1px solid rgba(255,255,255,.12)}
.dlg input,.r input.in{background:rgba(255,255,255,.08);color:var(--tx);border:1px solid rgba(255,255,255,.16);border-radius:10px}
.toast{background:rgba(24,26,38,.9);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.dlg-bg{background:rgba(5,8,16,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
</style>

/* ---------- mesin tampilan ---------- */
const stack=[];let q='';
const resolve=id=>{const[a,b]=id.split(':');return P[a](b)};
function rowH(r,R){const i=R.push(r)-1;
 const k=(r.go||r.act||r.tog||r.chk!==undefined)&&!r.input&&!r.slider?'k':'';
 if(r.blk)return`<div class="r blk">${r.blk}</div>`;
 if(r.slider){return`<div class="r"><input type="range" data-u="${esc(r.u||'')}" data-s="${r.slider}" min="${r.min}" max="${r.max}" step="${r.step}" value="${get(r.slider)}"></div>`}
 if(r.prof)return`<div class="r k prof" data-i="${i}"><div class="av"><img class="brandfx" alt="" src="${BRAND_URI}"></div><div class="tx"><b>${esc(r.t)}</b><small>${esc(r.sub)}</small></div><span class="ch">›</span></div>`;
 let on=typeof r.on==='function'?r.on():(r.tog===1?r.on:r.tog?get(r.tog):0);
 return`<div class="r ${k}${r.chk!==undefined?' llc':''} ${r.ic?'hi':''}" data-i="${i}"${r.chk?' data-ll-on="1"':''}>${r.ic?`<div class="ic" style="background:${r.icbg||r.ic[1]}">${r.ic[0]}</div>`:''}<div class="tx ${r.red?'red':r.ac?'ac':''}">${esc(r.t)}${r.sub?`<small>${esc(r.sub)}</small>`:''}</div>${r.html||''}${r.v!==undefined&&r.v!==''?`<span class="v">${esc(r.v)}</span>`:''}${r.input?`<input class="in" data-p="${r.input}" type="${r.type||'text'}" placeholder="${esc(r.ph||'')}" value="${esc(get(r.input))}" autocapitalize="off" autocorrect="off" spellcheck="false">`:''}${(r.tog||typeof r.on==='function')?`<div class="sw ${on?'on':''}"></div>`:''}${r.chk?'<span class="ck">✓</span>':''}${r.go?'<span class="ch">›</span>':''}</div>`}
function body(id){let pg=resolve(id),R=[],h=pg.big?`<h1 class="lt">${esc(pg.title)}</h1>`:'';
 if(pg.search)h+=`<div class="sr">🔍<input id="q" placeholder="Cari" value="${esc(q)}" type="search"></div>`;
 let groups=pg.groups;
 if(pg.search&&q){const k=q.toLowerCase();const hits=[];Object.keys(P).filter(x=>!['root','bucket'].includes(x)).forEach(x=>{const p=P[x]();p.groups.forEach(g=>g.rows.forEach(r=>{if(r.t&&r.t.toLowerCase().includes(k)&&(r.go||r.input||r.tog))hits.push({...r,sub:p.title,go:r.go||x})}));if(p.title.toLowerCase().includes(k))hits.push({t:p.title,go:x})});
  groups=[{rows:hits.length?hits:[{t:'Tidak ada hasil'}]}]}
 groups.forEach(g=>{h+=(g.h?`<div class="gh">${esc(g.h)}</div>`:'<div style="height:18px"></div>')+`<div class="g"${llAttr(g)}>${g.rows.map(r=>rowH(r,R)).join('')}</div>`+(g.f?`<div class="gf">${esc(g.f)}</div>`:'')});
 return[h,R,pg]}
function mk(id,first){const[h,R,pg]=body(id);const p=document.createElement('div');p.className='pane off';p.dataset.id=id;
 p.innerHTML=`<div class="nav"><div class="nb">${first?'<span class="sp2"></span>':'<button class="bk">‹ '+esc(stack.length?resolve(stack[stack.length-1].id).title:'Kembali')+'</button>'}<div class="nt">${esc(pg.title)}</div><span class="sp2"></span></div></div><div class="body">${h}</div>`;
 p._R=R;wire(p);$('#app').appendChild(p);if(pg.onOpen)setTimeout(pg.onOpen,0);return p}
function wire(p){const b=p.querySelector('.body'),n=p.querySelector('.nav');
 b.onscroll=()=>n.classList.toggle('sc',b.scrollTop>(p.dataset.id=='root'?50:8));
 const bk=p.querySelector('.bk');if(bk)bk.onclick=()=>go(-1);
 b.onclick=e=>{const ac=e.target.closest('[data-acc]');if(ac){pickAcc(ac.dataset.acc);return}const r=e.target.closest('[data-i]');if(!r||e.target.closest('input'))return;const o=p._R[r.dataset.i];
  if(o.tog&&o.tog!==1){set(o.tog,!get(o.tog));paint();return}
  if(o.act)o.act();else if(o.go)go(o.go)};
 b.onchange=e=>{const t=e.target;if(t.dataset.p){let v=t.value;if(t.type=='number')v=Math.max(0,+v||0);set(t.dataset.p,v);paint(1)}};
 b.oninput=e=>{const t=e.target;if(t.dataset.s){set(t.dataset.s,+t.value);const l=t.closest('.g').querySelector('.v');if(l)l.textContent=t.value+t.dataset.u}
  if(t.id=='q'){q=t.value.trim();const f=t.selectionStart;paint();const n=p.querySelector('#q');n.focus();n.setSelectionRange(f,f)}}}
function paint(f){const p=document.querySelector('.pane:last-child');if(!p||!stack.length)return;const sc=p.querySelector('.body').scrollTop,a=document.activeElement;
 if(!f&&a&&a.matches('input:not(#q)')&&a.type!='range')return;

function go(id,reset){
 if(id===-1){if(stack.length<2)return;const o=stack.pop(),el=document.querySelector('.pane:last-child');el.classList.add('off');const prev=document.querySelector(`.pane[data-id="${stack[stack.length-1].id}"]`);if(prev)prev.classList.remove('under');setTimeout(()=>el.remove(),D.ui.reduce?0:360);paint();return}
 if(reset){document.querySelectorAll('.pane').forEach(x=>x.remove());stack.length=0;q=''}
 const first=!stack.length,p=mk(id,first);stack.push({id});
 if(!first){const prev=p.previousElementSibling;if(prev)prev.classList.add('under')}
 requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.remove('off')))}
addEventListener('popstate',()=>go(-1));
['dragover','drop'].forEach(t=>addEventListener(t,e=>e.preventDefault()));

load();
const ro=document.documentElement;
addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data||{};

 if(d.srEff)ro.dataset.t=d.srEff;
 if(d.srShow){load();paint(1)}
 if(d.srGo){load();go('root',1);go(d.srGo)}});
go('root');
try{parent.postMessage({srSetReady:1},'*')}catch(e){}
try{parent.document.addEventListener('fullscreenchange',()=>paint(1))}catch(e){}
