<script>
/* presence.js v2
   Sesi per perangkat, status online, last seen, logout perangkat lain (segera).
   Struktur di server (WebDAV, relatif terhadap halaman):
     RADEN/sessions/<email>__<device>.json  -> satu file per perangkat yang sedang login
     RADEN/presence/<email>.json            -> last seen per user
   Perubahan:
   - MKCOL dibuat per tingkat folder (RADEN/, lalu RADEN/sessions/); PUT diulang setelah folder dibuat.
   - Pemeriksaan pencabutan setiap 3 detik. Tab di browser yang sama menerima pencabutan seketika (event storage).
   - EPOCH: bila nilai berubah, semua perangkat wajib login ulang.
*/
(function (g) {
  "use strict";

  var EPOCH = "relogin-2";           // ganti nilai ini untuk memaksa semua perangkat login ulang
  var CFG = {
    base: "RADEN/sessions/",
    users: "RADEN/presence/",
    checkMs: 1000,                   // pemeriksaan pencabutan (1 detik)
    beatMs: 20000,                   // interval menulis heartbeat
    onlineMs: 60000                  // online bila heartbeat < 60 detik
  };
  var lastErr = "";
  var ROOT = "";   // folder induk RADEN/ (absolut), diisi dari Maint.resolve()
  function sessDir() { return ROOT + CFG.base; }
  function usrDir() { return ROOT + CFG.users; }
  function ready() {
    if (!window.Maint || !Maint.resolve) return Promise.resolve();
    return Maint.resolve().then(function (b) { ROOT = b || ""; });
  }
  var KDEV = "pa-device", KEPOCH = "pa-epoch", KKICK = "pa-kick";
  var timer = null, me = null, onRevokeCb = null, hooked = false, lastBeat = 0, busy = false;

  // Kredensial server HTTP FS (disimpan dashboard di gd-auth, satu origin dengan semua halaman)
  function authHeaders(h) {
    h = h || {};
    try {
      var a = JSON.parse(localStorage.getItem("gd-auth") || "null");
      if (a && a.u) {
        var bytes = new TextEncoder().encode(a.u + ":" + (a.p || "")), x = "";
        for (var i = 0; i < bytes.length; i++) x += String.fromCharCode(bytes[i]);
        h.Authorization = "Basic " + btoa(x);
      }
    } catch (e) {}
    return h;
  }
  function _fetch(url, init) {
    init = init || {};
    init.headers = authHeaders(init.headers);
    return fetch(url, init);
  }
  function low(s) { return String(s || "").trim().toLowerCase(); }

  function deviceId() {
    var d = null;
    try { d = localStorage.getItem(KDEV); } catch (e) {}
    if (!d) {
      d = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try { localStorage.setItem(KDEV, d); } catch (e) {}
    }
    return d;
  }

  function deviceName(ua) {
    ua = String(ua || navigator.userAgent || "");
    if (/iPhone/.test(ua)) return "iPhone";
    if (/iPad/.test(ua)) return "iPad";
    if (/Android/.test(ua)) return "Android";
    if (/Windows/.test(ua)) return "Windows";
    if (/Macintosh|Mac OS/.test(ua)) return "Mac";
    if (/Linux/.test(ua)) return "Linux";
    return "Perangkat";
  }

  function fileName(email, dev) {
    return email.replace(/[^a-z0-9._-]/g, "_") + "__" + dev + ".json";
  }

  function dirOf(url) { return url.slice(0, url.lastIndexOf("/") + 1); }

  // Membuat setiap tingkat folder: RADEN/ lalu RADEN/sessions/ (405 = sudah ada, diabaikan)
  function mkcolPath(dir) {
    var u = new URL(dir, location.href);
    var parts = u.pathname.split("/").filter(Boolean), cur = "/", chain = Promise.resolve();
    parts.forEach(function (p) {
      cur += p + "/";
      var target = u.origin + cur;
      chain = chain.then(function () {
        return _fetch(target, { method: "MKCOL", cache: "no-store" }).catch(function () {});
      });
    });
    return chain;
  }

  function put(url, obj, keep) {
    var body = JSON.stringify(obj);
    function send() {
      return _fetch(url, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: body,
        cache: "no-store",
        keepalive: !!keep
      });
    }
    return send().then(function (r) {
      if (r.ok) return r;
      return mkcolPath(dirOf(url)).then(send);   // folder belum ada: buat lalu ulangi
    }).then(function (r) {
      lastErr = r.ok ? "" : "PUT " + url + " → HTTP " + r.status;
      return r;
    });
  }

  // null bila file tidak ada (404)
  function getJson(url) {
    return _fetch(url, { cache: "no-store" }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function listNames(dir) {
    return _fetch(dir, { method: "PROPFIND", headers: { Depth: "1" }, cache: "no-store" })
      .then(function (r) {
        if (!r.ok) { lastErr = "PROPFIND " + dir + " → HTTP " + r.status; return ""; }
        lastErr = ""; return r.text();
      })
      .then(function (t) {
        var re = /<(?:[a-zA-Z]+:)?href>([^<]+)<\/(?:[a-zA-Z]+:)?href>/g, m, out = [];
        while ((m = re.exec(t))) {
          var n = decodeURIComponent(m[1]).split("/").filter(Boolean).pop();
          if (n && /\.json$/i.test(n)) out.push(n);
        }
        return out;
      })
      .catch(function (e) { lastErr = "jaringan: " + (e && e.message ? e.message : "gagal"); return []; });
  }

  // Pemeriksaan berkala: cek pencabutan, dan tulis heartbeat bila sudah waktunya
  function check() {
    if (!me || busy) return;
    busy = true;
    var url = sessDir() + me.file;
    getJson(url).then(function (rec) {
      if (!me) return;
      if (!me.confirmed) {                          // file belum pernah tercipta: buat sekarang
        return put(url, me.rec).then(function (r) {
          if (r.ok && me) { me.confirmed = true; }
        });
      }
      if (!rec || rec.revoked) { stop(true); return; }   // dihapus / dicabut dari perangkat lain
      if (Date.now() - lastBeat >= CFG.beatMs) {
        lastBeat = Date.now();
        me.rec.seen = lastBeat;
        return put(url, me.rec).then(function () {
          return put(usrDir() + me.email + ".json", { email: me.email, lastSeen: lastBeat });
        });
      }
    }).catch(function () { /* gangguan jaringan: jangan logout */ })
      .then(function () { busy = false; });
  }

  function offline() {
    if (!me) return;
    me.rec.seen = 0;
    put(sessDir() + me.file, me.rec, true);
    put(usrDir() + me.email + ".json", { email: me.email, lastSeen: Date.now() }, true);
  }

  function onStorage(e) {
    if (!me || e.key !== KKICK || !e.newValue) return;
    try { if (JSON.parse(e.newValue).file === me.file) stop(true); } catch (err) {}
  }

  function start(email, name, onRevoked) {
    email = low(email);
    if (!email) return Promise.resolve(false);
    stop(false);
    var now = Date.now(), dev = deviceId();
    me = {
      email: email,
      file: fileName(email, dev),
      confirmed: false,
      rec: { email: email, name: String(name || email), device: dev, deviceName: deviceName(),
             ua: navigator.userAgent, started: now, seen: now, revoked: false }
    };
    lastBeat = now;
    onRevokeCb = typeof onRevoked === "function" ? onRevoked : null;
    if (!hooked) {
      hooked = true;
      addEventListener("pagehide", offline);
      addEventListener("storage", onStorage);
    }
    timer = setInterval(check, CFG.checkMs);
    return ready().then(function () { return mkcolPath(sessDir()); })
      .then(function () { return mkcolPath(usrDir()); })
      .then(function () { return put(sessDir() + me.file, me.rec); })
      .then(function (r) {
        if (me && r.ok) me.confirmed = true;
        return put(usrDir() + email + ".json", { email: email, lastSeen: now });
      })
      .then(function () { return !!(me && me.confirmed); })
      .catch(function () { return false; });
  }

  // notify = true bila dicabut dari perangkat lain (dipanggil onRevoked)
  function stop(notify) {
    clearInterval(timer); timer = null;
    var cb = onRevokeCb;
    if (me && !notify) {
      put(usrDir() + me.email + ".json", { email: me.email, lastSeen: Date.now() }, true);
      _fetch(sessDir() + me.file, { method: "DELETE", keepalive: true, cache: "no-store" }).catch(function () {});
    }
    me = null; onRevokeCb = null;
    if (notify && cb) cb();
  }

  function list() {
    return ready().then(function () { return listNames(sessDir()); }).then(function (names) {
      return Promise.all(names.map(function (n) {
        return getJson(sessDir() + n).catch(function () { return null; });
      }));
    }).then(function (recs) {
      var now = Date.now(), byUser = {};
      recs.forEach(function (r) {
        if (!r || r.revoked || !r.email) return;
        var u = byUser[r.email] || (byUser[r.email] = {
          email: r.email, name: r.name || r.email, devices: [], lastSeen: 0, online: false
        });
        var online = !!r.seen && now - r.seen < CFG.onlineMs;
        u.devices.push({
          device: r.device, deviceName: r.deviceName || "Perangkat",
          file: fileName(r.email, r.device), seen: r.seen || 0, online: online
        });
        u.lastSeen = Math.max(u.lastSeen, r.seen || 0);
        u.online = u.online || online;
      });
      return Object.keys(byUser).map(function (k) { return byUser[k]; });
    });
  }

  function lastSeenAll() {
    return ready().then(function () { return listNames(usrDir()); }).then(function (names) {
      return Promise.all(names.map(function (n) {
        return getJson(usrDir() + n).catch(function () { return null; });
      }));
    }).then(function (arr) {
      var o = {};
      arr.forEach(function (r) { if (r && r.email) o[r.email] = r.lastSeen || 0; });
      return o;
    });
  }

  // Cabut perangkat lain: tandai dicabut, kirim sinyal ke tab di browser yang sama, lalu hapus filenya
  function revoke(file) {
    return ready().then(function () { return revokeNow(file); });
  }
  function revokeNow(file) {
    var url = sessDir() + file;
    try { localStorage.setItem(KKICK, JSON.stringify({ file: file, t: Date.now() })); } catch (e) {}
    return getJson(url).then(function (rec) {
      if (!rec) return null;
      rec.revoked = true;
      return put(url, rec);
    }).then(function () {
      return _fetch(url, { method: "DELETE", cache: "no-store" }).catch(function () {});
    }).then(function () { return true; });
  }

  function status() { return { err: lastErr, root: ROOT }; }

  function epochOk() {
    try { return localStorage.getItem(KEPOCH) === EPOCH; } catch (e) { return true; }
  }
  function markEpoch() {
    try { localStorage.setItem(KEPOCH, EPOCH); } catch (e) {}
  }

  function avatarFor(email, name) {
    var s = low(email), h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    var letter = (String(name || email).trim().charAt(0) || "?").toUpperCase();
    return { letter: letter, hue: h, bg: "hsl(" + h + " 70% 55%)" };
  }

  function configure(opts) {
    if (opts) for (var k in opts) if (k in CFG) CFG[k] = opts[k];
  }

  g.Presence = {
    configure: configure, start: start, stop: stop, list: list,
    lastSeenAll: lastSeenAll, revoke: revoke, avatarFor: avatarFor,
    deviceId: deviceId, epochOk: epochOk, markEpoch: markEpoch, status: status
  };
})(window);

Presence.configure({ base: "RADEN/sessions/", users: "RADEN/presence/" });
</script>
<script>
/* maint.js v2 — mode maintenance global untuk server HTTP FS (disimpan di server: RADEN/)
   Saat ON: hanya admin yang boleh login; user yang sudah login melihat pesan maintenance.
   Perbaikan v2 (penyebab maintenance gagal di HTTP FS):
   1. Tulis status lewat PUT; bila server menolak (405/501/403…), otomatis upload multipart (POST) seperti login.html.
   2. Upload multipart tidak bisa menimpa berkas, jadi status juga ditulis sebagai berkas BARU
      maint_<waktu>_<1|0>.json; pembaca memilih yang paling baru (tanpa PUT/DELETE pun tetap jalan).
   3. Tulis & baca di SEMUA folder kandidat yang berisi RADEN/, lalu ambil yang TERBARU,
      sehingga setiap perangkat melihat status yang sama walau folder induknya terdeteksi berbeda.
   4. Daftar berkas dibaca lewat PROPFIND (dengan body XML), cadangan: halaman indeks folder HTML.
   Admin tidak terpengaruh. Jika server tidak bisa dijangkau, status terakhir yang dipakai. */
(function (g) {
  "use strict";
  var BASE = null;   // folder induk RADEN/ (absolut, diakhiri /), ditemukan otomatis
  var ADMIN = ["admin@gmail.com", "ozaacrew@gmail.com"];
  var IG_URL = "https://www.instagram.com/iniozaa._/";
  var state = { on: false, by: "", at: 0 }, timer = null, lastDiag = "", liveC = { t: 0, l: [] };
  var PQ = '<?xml version="1.0" encoding="utf-8"?><d:propfind xmlns:d="DAV:"><d:prop><d:resourcetype/></d:prop></d:propfind>';

  // Kredensial server HTTP FS (disimpan dashboard di gd-auth, satu origin dengan semua halaman)
  function authHeaders(h) {
    h = h || {};
    try {
      var a = JSON.parse(localStorage.getItem("gd-auth") || "null");
      if (a && a.u) {
        var bytes = new TextEncoder().encode(a.u + ":" + (a.p || "")), x = "";
        for (var i = 0; i < bytes.length; i++) x += String.fromCharCode(bytes[i]);
        h.Authorization = "Basic " + btoa(x);
      }
    } catch (e) {}
    return h;
  }
  function _fetch(url, init) {
    init = init || {};
    init.headers = authHeaders(init.headers);
    if (!init.cache) init.cache = "no-store";
    return fetch(url, init);
  }
  function low(s) { return String(s || "").trim().toLowerCase(); }
  function isAdmin(e) { return ADMIN.indexOf(low(e)) >= 0; }
  function okc(c) { return c >= 200 && c < 300; }
  function code(m, u, init) {
    init = init || {}; init.method = m;
    return _fetch(u, init).then(function (r) { return r.status; }, function () { return 0; });
  }

  // MKCOL per tingkat folder (405/301 = sudah ada, diabaikan)
  function mkdirs(dir) {
    var u;
    try { u = new URL(dir, location.href); } catch (e) { return Promise.resolve(); }
    var parts = u.pathname.split("/").filter(Boolean), cur = "/", chain = Promise.resolve();
    parts.forEach(function (p) {
      cur += p + "/";
      var t = u.origin + cur;
      chain = chain.then(function () { return code("MKCOL", t); });
    });
    return chain;
  }

  // Kandidat folder induk: yang pernah dipakai, folder halaman ini, lalu path server dari Pengaturan
  function candidates() {
    var out = [];
    /* server yang sama tampil di dua jalur: /files/ (hanya baca) dan /webdav/ (bisa ditulis).
       Semua kandidat dialihkan ke /webdav/ agar tulisan status maintenance tidak gagal 404 di HP. */
    function add(u) { if (!u) return; u = String(u).replace(/\/files\//, "/webdav/"); if (out.indexOf(u) < 0) out.push(u); }
    ["pa-base", "rd-wdir"].forEach(function (k) {
      try { var c = localStorage.getItem(k); if (c) { c = String(c); add(c.charAt(c.length - 1) === "/" ? c : c + "/"); } } catch (e) {}
    });
    try { add(new URL("./", location.href).href); } catch (e) {}
    ["rd-srv-path", "sr-path"].forEach(function (k) {
      try {
        var p = localStorage.getItem(k);
        if (!p) return;
        add(new URL(String(p).replace(/\\/g, "/").replace(/\/?$/, "/"), location.origin + "/").href);
      } catch (e) {}
    });
    try { add(location.origin + "/webdav/"); } catch (e) {}
    return out;
  }

  function probe(base) {
    return _fetch(base + "RADEN/", { method: "PROPFIND", headers: { Depth: "0", "Content-Type": "application/xml" }, body: PQ })
      .then(function (r) { return r.status === 207 || r.status === 200; })
      .catch(function () { return false; });
  }

  // Temukan folder induk yang berisi RADEN/ dan simpan untuk semua halaman
  function resolve() {
    if (BASE) return Promise.resolve(BASE);
    var list = candidates();
    var chain = Promise.resolve(null);
    list.forEach(function (c) {
      chain = chain.then(function (found) { return found || probe(c).then(function (ok) { return ok ? c : null; }); });
    });
    return chain.then(function (found) {
      if (found) return found;
      // belum ada RADEN/: buat di kandidat pertama yang bisa ditulisi
      var tries = Promise.resolve(null);
      list.forEach(function (c) {
        tries = tries.then(function (done) {
          if (done) return done;
          return mkdirs(c + "RADEN/").then(function () { return probe(c); }).then(function (ok) { return ok ? c : null; });
        });
      });
      return tries.then(function (d) { return d || (list[0] || location.href); });
    }).then(function (b) {
      BASE = b;
      try { localStorage.setItem("pa-base", b); } catch (e) {}
      return BASE;
    });
  }

  function file() { return (BASE || "") + "RADEN/maintenance.json"; }
  function dirRaden() { return (BASE || "") + "RADEN/"; }

  // Semua folder RADEN/ yang benar-benar ada (BASE lebih dulu); di-cache 30 detik
  function liveDirs() {
    if (Date.now() - liveC.t < 30000 && liveC.l.length) return Promise.resolve(liveC.l);
    return resolve().then(function () {
      var others = candidates().filter(function (c) { return c !== BASE; });
      return Promise.all(others.map(function (c) { return probe(c); })).then(function (oks) {
        var l = [BASE + "RADEN/"];
        others.forEach(function (c, i) { if (oks[i]) l.push(c + "RADEN/"); });
        liveC = { t: Date.now(), l: l };
        return l;
      });
    });
  }

  // Daftar berkas status maint_<waktu>_<1|0>.json di satu folder (PROPFIND, cadangan: indeks HTML)
  function listEvents(rd) {
    function parse(t) {
      var re = /maint_(\d{10,})_([01])\.json/g, m, seen = {}, out = [];
      while ((m = re.exec(t))) { if (!seen[m[0]]) { seen[m[0]] = 1; out.push({ at: +m[1], on: m[2] === "1", name: m[0] }); } }
      return out;
    }
    return _fetch(rd, { method: "PROPFIND", headers: { Depth: "1", "Content-Type": "application/xml" }, body: PQ })

  }

  // Baca satu folder: berkas maintenance.json + berkas status; ambil yang terbaru
  function readDir(rd) {
    var best = null, reach = false;
    function take(s) { if (s && (!best || s.at >= best.at)) best = s; }
    return _fetch(rd + "maintenance.json").then(function (r) {
      if (r.status === 404 || r.status === 405) { reach = true; return null; }
      if (!r.ok) return null;
      reach = true;
      return r.json().then(function (j) { return { on: !!(j && j.on), by: (j && j.by) || "", at: +(j && j.at) || 0 }; }, function () { return null; });
    }, function () { return null; }).then(function (s) {
      take(s);
      return listEvents(rd);
    }).then(function (ev) {
      if (ev.length) reach = true;
      ev.forEach(function (e) { take({ on: e.on, by: "", at: e.at }); });
      return { reach: reach, rec: best };
    });
  }

  function get() {
    return liveDirs().then(function (dirs) { return Promise.all(dirs.map(readDir)); }).then(function (rs) {
      var any = false, best = null;
      rs.forEach(function (x) { if (x.reach) any = true; if (x.rec && (!best || x.rec.at >= best.at)) best = x.rec; });
      if (!any) throw new Error("server tidak terjangkau");
      var s = best || { on: false, by: "", at: 0 };
      state = { on: !!s.on, by: s.by || "", at: s.at || 0 };
      try { localStorage.setItem("pa-maint", JSON.stringify(state)); } catch (e) {}
      return state;
    }).catch(function () {
      // server tidak bisa diakses: pakai status terakhir yang tersimpan di browser ini
      try { var c = JSON.parse(localStorage.getItem("pa-maint") || "null"); if (c) state = c; } catch (e) {}
      return state;
    });
  }

  // Tulis ke satu folder: PUT maintenance.json → (MKCOL+PUT) → upload multipart berkas baru
  function writeDir(rd, st) {
    var body = JSON.stringify(st), name = "maint_" + st.at + "_" + (st.on ? 1 : 0) + ".json", trail = [], last = 0;
    function put() {
      return code("PUT", rd + "maintenance.json", { headers: { "Content-Type": "application/json" }, body: body }).then(function (c) { trail.push("PUT " + c); last = c; return c; });

    function post() {

    function verify() { return code("GET", rd + name).then(function (c) { return okc(c); }); }

        if (okc(c2)) return done("PUT", true);

          var re = (p === 404 || p === 409) ? mkdirs(rd).then(post) : Promise.resolve(p);
          return re.then(function (p2) {
            if (!okc(p2)) return done("POST", false);
            return verify().then(function (v) { return done("POST", v); });

  // Hapus berkas status lama (opsional; gagal diabaikan)
  function tidy(rd, keepAt) {
    return listEvents(rd).then(function (ev) {
      return Promise.all(ev.filter(function (e) { return e.at < keepAt; }).map(function (e) { return code("DELETE", rd + e.name); }));
    }).catch(function () {});
  }

  function set(on, by) {
    var st = { on: !!on, by: low(by), at: Date.now() };
    return liveDirs().then(function (dirs) { return Promise.all(dirs.map(function (d) { return writeDir(d, st); })); }).then(function (rs) {
      lastDiag = rs.map(function (r) { return (r.ok ? "✔ " : "✘ ") + r.trail; }).join(" | ");
      var good = rs.filter(function (r) { return r.ok; });
      if (!good.length) {
        var c = 0;
        rs.forEach(function (r) { var s = r.st; if (s === 401 || s === 403) c = s; else if (!c && s) c = s; });
        liveC.t = 0;
        throw new Error("HTTP " + c + " (" + lastDiag + ")");
      }
      state = st;
      try { localStorage.setItem("pa-maint", JSON.stringify(st)); } catch (e) {}
      good.forEach(function (r) { tidy(r.dir, st.at); });

    });
  }

  function mount(el) { (document.body || document.documentElement).appendChild(el); }

  function overlay() {
    if (document.getElementById("maintOv")) return;
    var st = document.createElement("style");
    st.textContent =
      "#maintOv{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:rgba(7,11,26,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Arial,sans-serif;color:#f4f5f8}" +
      "#maintOv .mt-card{max-width:440px;width:100%;text-align:center;padding:32px 28px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.26);box-shadow:0 30px 70px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.4)}" +
      "#maintOv h1{margin:0 0 14px;font-size:24px;font-weight:700;letter-spacing:-.01em}" +
      "#maintOv p{margin:0 0 18px;font-size:16px;color:rgba(244,245,248,.78)}" +
      "#maintOv .mt-ig{display:inline-flex;align-items:center;gap:0;font-size:17px;font-weight:600;color:#fff;text-decoration:none;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}" +
      "#maintOv .mt-ig svg{display:block;width:22px;height:22px;margin:0;flex:0 0 22px}" +
      "#maintOv .mt-ig span{display:inline-block;margin:0;padding:0;line-height:22px}";
    var d = document.createElement("div");
    d.id = "maintOv"; d.setAttribute("role", "alertdialog"); d.setAttribute("aria-live", "assertive");
    /* klik di mana saja untuk menutup pesan saja (tidak mengubah status atau sesi) */
    d.addEventListener("click", function () { unmask(); });
    d.innerHTML = '<div class="mt-card"><h1>Sistem sedang maintenance</h1><p>silahkan cek pembaruan di</p>' +
      '<a class="mt-ig" href="' + IG_URL + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.4" cy="6.6" r="1.4" fill="currentColor"/></svg><span>@iniozaa._</span></a></div>';
    document.head.appendChild(st);
    d.setAttribute("aria-modal", "true"); d.setAttribute("tabindex", "-1");
    d.addEventListener("keydown", function (e) { if (e.key === "Escape") unmask(); });
    mount(d);
    try { d.focus(); } catch (e) {}
    document.documentElement.style.overflow = "hidden";
  }

  function unmask() {
    var d = document.getElementById("maintOv");
    if (d) d.remove();
    document.documentElement.style.overflow = "";
  }

  // Terapkan status ke halaman untuk email tertentu
  function apply(st, email) {
    if (st.on && !isAdmin(email)) overlay(); else unmask();
  }

  function gate(email) {
    return get().then(function (st) { apply(st, email); return st.on && !isAdmin(email); });
  }

  // Pantau terus: user yang sudah login melihat pesan saat maintenance aktif
  function watch(email) {
    if (timer) clearInterval(timer);

/* ---------- latar: bola cahaya yang melayang pelan ---------- */
.orbs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; will-change: transform; }
.orb.a { width: 46vmax; height: 46vmax; left: -12vmax; top: -14vmax; background: radial-gradient(circle at 30% 30%, var(--o1), transparent 70%); animation: drift1 22s ease-in-out infinite alternate; }
.orb.b { width: 40vmax; height: 40vmax; right: -12vmax; top: 6vmax; background: radial-gradient(circle at 60% 40%, var(--o2), transparent 70%); animation: drift2 26s ease-in-out infinite alternate; }
.orb.c { width: 42vmax; height: 42vmax; left: 6vmax; bottom: -20vmax; background: radial-gradient(circle at 50% 50%, var(--o3), transparent 70%); animation: drift3 30s ease-in-out infinite alternate; }
.orb.d { width: 28vmax; height: 28vmax; right: 8vmax; bottom: -8vmax; background: radial-gradient(circle at 50% 50%, var(--o4), transparent 70%); opacity: .55; animation: drift1 34s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { to { transform: translate3d(8vmax, 6vmax, 0) scale(1.1); } }
@keyframes drift2 { to { transform: translate3d(-9vmax, 8vmax, 0) scale(.92); } }
@keyframes drift3 { to { transform: translate3d(10vmax, -7vmax, 0) scale(1.08); } }

/* ---------- permukaan kaca ---------- */
.glass {
  position: relative;
  background: linear-gradient(145deg, var(--glass-strong), var(--glass));
  -webkit-backdrop-filter: blur(6px) saturate(140%); /* sebelumnya 12px */
  backdrop-filter: blur(6px) saturate(140%);
  border: 1px solid var(--edge-dim);
  box-shadow: var(--shadow), inset 0 1.5px 0 var(--edge), inset 0 -1px 0 var(--edge-dim), inset 1px 0 0 var(--edge-dim), inset -1px 0 0 var(--edge-dim);
}
.glass::before { /* kilau spekular di tepi atas */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 70% at 18% -10%, rgba(255, 255, 255, .55), transparent 55%);
  opacity: .3; mix-blend-mode: soft-light;
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-strong); }
}

.card { z-index: 1; width: 100%; max-width: 410px; border-radius: 40px; padding: 34px 24px 24px; animation: rise .7s cubic-bezier(.2, .9, .25, 1) both; }
.card.wide { max-width: 520px; }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
.card.shake { animation: shake .45s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake { 15%, 85% { transform: translateX(-3px); } 30%, 70% { transform: translateX(6px); } 45%, 55% { transform: translateX(-8px); } }

/* ---------- ikon aplikasi (squircle kaca) ---------- */
.icon {
  width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 26px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(150deg, #5ac8fa 0%, var(--tint) 45%, var(--tint-2) 100%);
  box-shadow: 0 16px 34px -10px rgba(10, 132, 255, .65), inset 0 2px 0 rgba(255, 255, 255, .55), inset 0 -8px 16px rgba(0, 0, 80, .18);
  position: relative; overflow: hidden;
}
.icon::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .35), transparent 48%); }
.icon svg { width: 44px; height: 44px; position: relative; z-index: 1; filter: drop-shadow(0 2px 4px rgba(0, 30, 90, .35)); }
.icon.avatar { font-size: 34px; font-weight: 700; letter-spacing: -.5px; border-radius: 50%; }

h1 { margin: 0; text-align: center; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -.6px; }
.sub { margin: 8px 0 26px; text-align: center; color: var(--text-2); font-size: 15px; }

/* ---------- formulir: grup input ala iOS ---------- */
form { display: grid; gap: 14px; }
.group { border-radius: 22px; background: var(--field); border: 1px solid var(--edge-dim); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .06); overflow: hidden; }
.group .row { display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 54px; cursor: text; transition: background .2s; }
.group .row + .row { border-top: 1px solid var(--hair); }
.group .row:focus-within { background: rgba(255, 255, 255, .22); }
.group .lbl { width: 62px; flex: none; font-size: 15px; font-weight: 600; color: var(--text); }
.group input, .field {
  flex: 1; min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: var(--text);
  font: inherit; font-size: 17px; /* >=16px: iOS tidak memperbesar layar saat fokus */ padding: 15px 0;
}
.group input::placeholder, .field::placeholder { color: var(--text-2); opacity: .75; }
.eye { flex: none; width: 36px; height: 36px; margin-right: -8px; border: 0; border-radius: 50%; background: transparent; color: var(--text-2); display: grid; place-items: center; cursor: pointer; transition: background .2s, color .2s; }
.eye:hover { background: var(--hair); color: var(--text); }
.eye svg { width: 22px; height: 22px; }
.eye .off { display: none; }
.eye[aria-pressed="true"] .on { display: none; }
.eye[aria-pressed="true"] .off { display: block; }

.err { min-height: 18px; margin: -6px 6px -4px; font-size: 14px; font-weight: 500; color: var(--bad); text-align: center; }

/* saklar iOS */
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 6px; font-size: 16px; cursor: pointer; position: relative; user-select: none; }
.switch-row input { position: absolute; right: 0; top: 0; width: 52px; height: 32px; margin: 0; opacity: 0; cursor: pointer; }
.sw { flex: none; position: relative; width: 52px; height: 32px; border-radius: 99px; background: var(--hair); transition: background .25s; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .12); }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .25), 0 1px 1px rgba(0, 0, 0, .2); transition: transform .3s cubic-bezier(.3, 1.4, .5, 1), width .2s; }
.switch-row input:checked + .sw { background: var(--ok); }
.switch-row input:checked + .sw::after { transform: translateX(20px); }
.switch-row input:active + .sw::after { width: 34px; }
.switch-row input:checked:active + .sw::after { transform: translateX(14px); }
.switch-row input:focus-visible + .sw { outline: 3px solid var(--tint); outline-offset: 3px; }

/* ---------- tombol ---------- */
.btn {
  position: relative; width: 100%; min-height: 54px; border: 0; border-radius: 99px; cursor: pointer; color: #fff;
  font: inherit; font-size: 17px; font-weight: 600; letter-spacing: -.2px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(180deg, #1f86f5, #0a6fe0 55%, #0058c0);
  box-shadow: 0 12px 26px -10px rgba(10, 132, 255, .75), inset 0 1.5px 0 rgba(255, 255, 255, .5), inset 0 -2px 0 rgba(0, 0, 90, .15);
  transition: transform .2s cubic-bezier(.3, 1.4, .5, 1), filter .2s, box-shadow .2s, opacity .2s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .6; cursor: default; transform: none; filter: none; }
.btn:focus-visible, .eye:focus-visible, .link:focus-visible { outline: 3px solid var(--tint); outline-offset: 3px; }
.btn.ghost {
  color: var(--text); background: var(--field); border: 1px solid var(--edge-dim);
  box-shadow: inset 0 1.5px 0 var(--edge), 0 6px 16px -10px rgba(0, 0, 0, .25);
}
.btn.ghost:hover { filter: none; background: var(--glass-strong); }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, .4); border-top-color: #fff; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.foot { margin: 20px 0 0; text-align: center; font-size: 13px; color: var(--text-2); }
.link { background: none; border: 0; padding: 4px 8px; font: inherit; font-size: 15px; font-weight: 600; color: var(--tint); cursor: pointer; border-radius: 10px; }
.stack { display: grid; gap: 10px; margin-top: 22px; }
.center { text-align: center; }

/* ---------- keadaan berhasil ---------- */
.check { width: 84px; height: 84px; margin: 0 auto 18px; }
.check circle { fill: rgba(48, 209, 88, .16); stroke: var(--ok); stroke-width: 3; stroke-dasharray: 227; stroke-dashoffset: 227; transform: rotate(-90deg); transform-origin: 50% 50%; animation: draw .6s .05s ease-out forwards; }
.check path { fill: none; stroke: var(--ok); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; animation: draw .4s .5s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.prog { height: 6px; border-radius: 99px; background: var(--hair); overflow: hidden; margin: 6px 4px 0; }
.prog i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--tint), var(--tint-2)); transition: width 1.3s cubic-bezier(.3, .7, .2, 1); }

/* ---------- halaman web tujuan (home) & alat akun ---------- */
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; font-size: 14px; font-weight: 600; background: var(--field); border: 1px solid var(--edge-dim); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(48, 209, 88, .22); }
.tile { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; background: var(--field); border: 1px solid var(--edge-dim); }
.tile b { display: block; font-size: 16px; }
.tile small { color: var(--text-2); font-size: 13px; }
.code { width: 100%; min-height: 150px; resize: vertical; padding: 14px; border-radius: 18px; border: 1px solid var(--edge-dim); background: var(--field); color: var(--text); font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; outline: 0; }
.hint { font-size: 13px; color: var(--text-2); margin: 0 6px; }
.select { appearance: none; -webkit-appearance: none; }

@media (max-width: 380px) { .card { padding: 28px 16px 20px; border-radius: 34px; } h1 { font-size: 27px; } .group .lbl { width: 54px; } }


/* ===== Tampilan ala Instagram · iOS 26 (Liquid Glass) ===== */
.card { border-radius: 44px; padding: 40px 26px 26px; }
.card::after { content: ""; position: absolute; left: 50%; top: -1px; width: 46%; height: 1px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, var(--edge), transparent); pointer-events: none; }
.icon { width: 88px; height: 88px; border-radius: 30px; margin-bottom: 20px; }
h1 { font-size: 30px; letter-spacing: -.8px; }
.sub { margin: 8px 0 24px; }
form { gap: 12px; }
.group { border-radius: 26px; background: var(--field); }
.group .row { min-height: 58px; }
.group .row:focus-within { background: rgba(255, 255, 255, .18); box-shadow: inset 0 0 0 1.5px var(--tint); }
.group .lbl { width: 66px; color: var(--text-2); font-weight: 600; }
.btn { min-height: 56px; font-size: 17px; border-radius: 28px; }
.btn.ghost { border-radius: 28px; min-height: 52px; }
.err { min-height: 20px; }
.link { font-weight: 600; }
.stack { gap: 6px; }
.foot { margin-top: 18px; }

/* daftar akun */
.accs { display: grid; gap: 10px; margin: 0 0 14px; }
.acc {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px 12px 12px;
  border: 1px solid var(--edge-dim); border-radius: 26px; background: var(--field); color: var(--text);
  font: inherit; text-align: left; cursor: pointer; position: relative; overflow: hidden;
  box-shadow: inset 0 1.5px 0 var(--edge), 0 8px 20px -14px rgba(0, 0, 0, .35);
  transition: transform .25s cubic-bezier(.3, 1.4, .5, 1), background .2s;
}
.acc::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(120% 80% at 10% -20%, rgba(255, 255, 255, .35), transparent 55%); opacity: .6; }
.acc:hover { background: var(--glass-strong); }
.acc:active { transform: scale(.975); }
.acc:focus-visible { outline: 3px solid var(--tint); outline-offset: 3px; }
.acc.old .ai small { color: var(--bad); }
.acc .ai { flex: 1; min-width: 0; position: relative; }
.acc .ai b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.2px; }
.acc .ai small { display: block; margin-top: 1px; color: var(--text-2); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acc .chev { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); background: var(--hair); position: relative; }
.av { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 20px; position: relative;
  background: linear-gradient(150deg, var(--h1, #5ac8fa), var(--h2, #5e5ce6)); box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .5), 0 6px 14px -6px rgba(0, 0, 0, .4); }
.av.big { width: 64px; height: 64px; font-size: 26px; }
.btn.ghost svg { flex: none; }
.center .btn.ghost { margin-top: 0; }

/* ===== Logo SERVER GALLERY (menggantikan ikon awan upload) ===== */
.icon, .icon.logo { width: 112px; height: 112px; border-radius: 0; background: none; box-shadow: none; overflow: visible; margin-bottom: 14px; }
.icon::after { display: none; }
.icon svg { width: 100%; height: 100%; filter: drop-shadow(0 14px 22px rgba(60, 20, 140, .45)); }
/* handle Instagram di bawah judul */
.sub.ig { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; letter-spacing: .2px; }
.sub.ig svg { width: 18px; height: 18px; flex: none; margin-right: 1px; }

/* ===== Revisi: logo galaksi, label owner, judul, blur kaca, seleksi teks ===== */
:root { --brand-a: #0b1020; --brand-b: #5b3fd1; --brand-c: #0e7490; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --brand-a: #ffffff; --brand-b: #c4b5fd; --brand-c: #67e8f9; }
}
:root[data-theme="dark"] { --brand-a: #ffffff; --brand-b: #c4b5fd; --brand-c: #67e8f9; }

/* teks halaman tidak bisa diseleksi, jadi menu Salin / Pilih semua / Bagikan tidak muncul saat ditekan lama */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }

/* judul logo: gradasi ala galaksi, ikut tema terang/gelap */
.brand {
  width: fit-content; margin: 0 auto;
  background: linear-gradient(100deg, var(--brand-a) 15%, var(--brand-b) 55%, var(--brand-c) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 0 16px rgba(124, 58, 237, .35));
}

/* label developer: teks biasa, tanpa kaca maupun warna */
.owner {
  display: inline; padding: 0; margin: 0; height: auto; border: 0; border-radius: 0;
  background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
  color: inherit; font: inherit; letter-spacing: normal;
}

/* animasi halus pada logo (dimatikan bila pengguna memilih gerak dikurangi) */
.lg-spark { transform-box: fill-box; transform-origin: center; animation: lgTwinkle 3.6s ease-in-out infinite; }
.lg-spark2 { animation-duration: 2.8s; animation-delay: -1.2s; }
.lg-spark3 { animation-duration: 4.2s; animation-delay: -2.1s; }
.lg-led { animation: lgLed 2.6s ease-in-out infinite; }
.lg-led2 { animation-delay: -1.3s; }
@keyframes lgTwinkle { 0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); } 50% { opacity: .35; transform: scale(.55) rotate(45deg); } }
@keyframes lgLed { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }


/* ===== Logo: kembang-kempis + partikel mini logo ===== */
.icon { z-index: 2; }
.icon svg { transform-origin: 50% 50%; animation: lgBreathe 3.4s ease-in-out infinite; will-change: transform; }
@keyframes lgBreathe {
  0%, 100% { transform: scale(.92); filter: drop-shadow(0 10px 16px rgba(60, 20, 140, .35)); }
  50%      { transform: scale(1.1);  filter: drop-shadow(0 18px 30px rgba(124, 58, 237, .6)); }
}
.fx-p { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; z-index: -1; opacity: 0; will-change: transform, opacity; filter: drop-shadow(0 0 6px rgba(167, 139, 250, .7)); }


/* ikon Instagram menempel langsung ke handle (tanpa jarak) */
.sub.ig svg { margin-right: 0; }
.sub.ig svg + span { margin-left: -10px; } /* batalkan gap 8px + ruang kosong bawaan di dalam ikon (~2px) */
/* mobile: beri jarak satu spasi (~4px) antara ikon Instagram dan @iniozaa._ */
@media (max-width: 600px), (pointer: coarse) { .sub.ig svg + span { margin-left: -4px; } }
.center .sub:empty { display: none; }
.center .note:empty { display: none; }
.center .av.big { width: 84px; height: 84px; font-size: 34px; margin: 0 auto 18px; animation: avPop .55s cubic-bezier(.3, 1.4, .5, 1) both; }
@keyframes avPop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }

.fxwrap{position:relative;display:block;width:fit-content;margin:0 auto 18px;}
.fxwrap>.av.big{margin:0;}
.fxp{position:absolute;left:50%;top:50%;pointer-events:none;z-index:0;line-height:1;display:block;opacity:0;will-change:transform,opacity;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.fxp svg{width:100%;height:100%;display:block}
.av.logo svg{width:100%;height:100%;display:block}
.fxwrap{isolation:isolate;}
.fxwrap.chw{margin:0;flex:none;width:52px;height:52px;}
.fxwrap.chw>.av{margin:0;}
.acc{overflow:visible!important;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

:where(button,a,[role=button],[tabindex],summary,select,textarea):focus-visible{outline:2px solid #0a84ff!important;outline-offset:2px!important}
.sub.ig{gap:0 !important}.sub.ig .owner{margin-right:8px}.sub.ig svg{margin:0 !important}.sub.ig svg + span{margin-left:0 !important}.brand,.brand *{background:none !important;-webkit-background-clip:border-box !important;background-clip:border-box !important;-webkit-text-fill-color:var(--text) !important;color:var(--text) !important;filter:none !important;text-shadow:none !important}h1,h2,h3,p,span,label,.sub,.owner{text-shadow:none !important}.group{overflow:visible !important}/* baris "timbul" saat aktif, lalu kembali halus saat tidak aktif *//* 3D: setiap kolom punya kedalaman; saat aktif naik ke depan dengan bayangan jatuh */.group .row{position:relative;z-index:0;border-radius:14px;margin:4px 6px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.25),0 2px 6px -3px rgba(0,0,0,.45);transform:translateZ(0);transition:transform .34s cubic-bezier(.2,.9,.3,1.25),box-shadow .34s ease,background .34s ease}.group .row:focus-within{z-index:2;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05)) !important;transform:translateY(-3px) scale(1.02);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 14px 26px -10px rgba(0,0,0,.7),0 4px 8px -4px rgba(0,0,0,.45) !important}.group .row + .row{border-top:0}.group input:focus,.group input:focus-visible{outline:none !important;box-shadow:none !important;-webkit-appearance:none}/* border kelompok ikut naik bersama kolom yang aktif */.group{transition:transform .34s cubic-bezier(.2,.9,.3,1.25),box-shadow .34s ease,border-color .34s ease}.group:focus-within{transform:translateY(-2px) scale(1.008);border-color:rgba(255,255,255,.22) !important;box-shadow:inset 0 1px 2px rgba(0,0,0,.06),0 16px 30px -14px rgba(0,0,0,.75) !important}</style>

<body>
<canvas id="galaxyBg" aria-hidden="true"></canvas>
<noscript><p style="position:relative;z-index:1">Aktifkan JavaScript untuk masuk.</p></noscript>
<main class="card glass" id="app" aria-live="polite"></main>
<script>
/* ============================================================
   PENGATURAN LOGIN — edit file ini untuk menambah / mengubah akun
   ------------------------------------------------------------
   • Sandi TIDAK disimpan sebagai teks. Buat entri akun lewat halaman
     login.html#buat, lalu tempel hasilnya ke dalam daftar "users" di bawah.
   • redirect  : file tujuan setelah login berhasil untuk akun itu.
                 Jika dikosongkan -> memakai defaultRedirect.
   • ozaacrew@gmail.com diarahkan ke StorageRaden.html.

    zoomTarget = v ? ZOOM_OUT : ZOOM_IN;
  }
  window.addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('input,textarea,select,button,a,label')) return;
    setHold(true);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t =>
    window.addEventListener(t, () => setHold(false)));

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* jarak tergulung (wrap) ke rentang [-P/2, P/2) */
  const wrapD = d => ((d + P / 2) % P + P) % P - P / 2;

  /* skala dasar: menyesuaikan sisi terpendek layar agar tampil proporsional di HP & desktop */
  const unit = () => Math.min(W, H) / 900;

  const easeOut = t => 1 - Math.pow(1 - t, 3);

  const KLIM = 2; // batas salinan dunia per arah (mencegah lag saat zoom keluar)
  function draw(now) {
    const dt = Math.min(64, now - lastT); lastT = now; tNow += dt;
    zoom += (zoomTarget - zoom) * (1 - Math.pow(0.02, dt / 1000));
    const u = unit();
    const sc = zoom * u;                 // px per satuan dunia
    const period = P * sc;               // lebar satu putaran dunia dalam px

    // latar
    const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
    if (light) { bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.55, '#e9eeff'); bg.addColorStop(1, '#d6e2ff'); }
    else { bg.addColorStop(0, '#0c1130'); bg.addColorStop(1, '#03040a'); }
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // bintang: dunia tetap, diulang sampai menutupi seluruh layar
    const kMax = Math.ceil(W / period) + 1;
    const kMaxY = Math.ceil(H / period) + 1;
    ctx.fillStyle = light ? '#2b2f7a' : '#e8efff';
    for (const st of stars) {
      const dx = wrapD(st.x - camX), dy = wrapD(st.y - camY);
      const tw = 0.75 + 0.25 * Math.sin(tNow * 0.002 + st.tw);
      ctx.globalAlpha = st.a * tw;
      for (let kx = Math.max(-KLIM, Math.ceil((-4 - W / 2 - dx * sc) / period)); kx <= Math.min(KLIM, Math.floor((W + 4 - W / 2 - dx * sc) / period)); kx++) {
        const px = W / 2 + dx * sc + kx * period;
        for (let ky = Math.max(-KLIM, Math.ceil((-4 - H / 2 - dy * sc) / period)); ky <= Math.min(KLIM, Math.floor((H + 4 - H / 2 - dy * sc) / period)); ky++) {
          const py = H / 2 + dy * sc + ky * period;
          ctx.fillRect(px - st.r * u, py - st.r * u, st.r * 2 * u, st.r * 2 * u);
        }
      }
    }
    ctx.globalAlpha = 1;

    // galaksi: sama seperti bintang, diulang di setiap putaran dunia
    ctx.globalCompositeOperation = light ? 'source-over' : 'lighter';
    for (const g of galaxies) {
      g.rot += g.spin * dt;
      const size = g.s * 120 * u * zoom;
      const dx = wrapD(g.x - camX), dy = wrapD(g.y - camY);
      ctx.globalAlpha = Math.min(1, 0.4 + 0.6 * Math.min(1, zoom));
      for (let kx = Math.max(-KLIM, Math.ceil((-size - W / 2 - dx * sc) / period)); kx <= Math.min(KLIM, Math.floor((W + size - W / 2 - dx * sc) / period)); kx++) {
        const px = W / 2 + dx * sc + kx * period;
        for (let ky = Math.max(-KLIM, Math.ceil((-size - H / 2 - dy * sc) / period)); ky <= Math.min(KLIM, Math.floor((H + size - H / 2 - dy * sc) / period)); ky++) {
          const py = H / 2 + dy * sc + ky * period;
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(g.rot);
          ctx.drawImage((light ? SPRITES_L : SPRITES)[g.k], -size / 2, -size / 2, size, size);
          ctx.restore();
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // vignette lembut seperti citra satelit
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, light ? 'rgba(90,110,180,0.18)' : 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(t => { lastT = t; draw(t); });
})();
</script>
<script>
/* blokir menu seleksi teks (Salin / Pilih semua / Bagikan) saat teks ditekan lama.
   Kolom isian (input & textarea) tetap bisa diketik dan ditempel. */
(function () {
  function inField(n) {
    var el = n && (n.nodeType === 1 ? n : n.parentElement);
    return !!(el && el.closest && el.closest("input, textarea"));
  }
  document.addEventListener("selectstart", function (e) { if (!inField(e.target)) e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { if (!inField(e.target)) e.preventDefault(); });
})();
</script>
<script>
/* efek logo: kembang-kempis (CSS) + partikel mini logo yang keluar dari pusat logo mengikuti denyut */
(function () {
  
  var app = document.getElementById("app"), src = null, active = null, timer = 0;
  function logoURL(svg) { return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }
  function burst(icon, n) {
    if (document.hidden || !icon.isConnected || !icon.animate) return;
    var r = icon.getBoundingClientRect(), base = r.width / 2;
    for (var i = 0; i < n; i++) {
      var im = new Image(); im.src = src; im.className = "fx-p"; im.alt = ""; im.draggable = false;
      var sz = 8 + Math.random() * 16; im.style.width = im.style.height = sz + "px"; im.style.margin = (-sz / 2) + "px 0 0 " + (-sz / 2) + "px";
      icon.appendChild(im);
      var a = Math.random() * Math.PI * 2, d = base * (0.9 + Math.random() * 1.5), rot = (Math.random() - .5) * 540;
      var x = Math.cos(a) * d, y = Math.sin(a) * d, dur = 1400 + Math.random() * 1400;
      var an = im.animate([
        { transform: "translate(0,0) scale(.2) rotate(0deg)", opacity: 0 },
        { transform: "translate(" + x * .35 + "px," + y * .35 + "px) scale(1) rotate(" + rot * .3 + "deg)", opacity: .95, offset: .25 },
        { transform: "translate(" + x + "px," + (y - 14) + "px) scale(.15) rotate(" + rot + "deg)", opacity: 0 }
      ], { duration: dur, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" });
      an.onfinish = (function (el) { return function () { el.remove(); }; })(im);
    }
  }
  function attach() {
    var icon = app.querySelector(".icon");
    if (!icon || icon === active) return;
    var svg = icon.querySelector("svg"); if (!svg) return;
    active = icon; src = logoURL(svg.outerHTML);
    clearInterval(timer);
    burst(icon, 5);
    timer = setInterval(function () {
      if (!active || !active.isConnected) { clearInterval(timer); active = null; return; }
      burst(active, 2 + ((Math.random() * 3) | 0));
    }, 520);
  }
  new MutationObserver(attach).observe(app, { childList: true });
  attach();
})();
</script>
<script>
/* banner maintenance di halaman login: terlihat semua user; admin tetap bisa masuk */
(function () {
  function show(on) {
    var b = document.getElementById("maintBanner");
    if (!on) { if (b) b.remove(); return; }
    var host = document.getElementById("app");
    if (!host) return;
    if (!b) {
      b = document.createElement("div"); b.id = "maintBanner"; b.setAttribute("role", "status");
      b.textContent = "MAINTENANCE!!";
      b.style.cssText = "position:relative;display:block;width:100%;margin:0 0 12px;padding:0;border:0;border-radius:0;background:none;box-shadow:none;font:800 20px/1.3 -apple-system,system-ui,sans-serif;letter-spacing:.04em;color:#ff3b30;text-align:center;z-index:1";
    }
    if (b.parentNode !== host || host.firstChild !== b) host.insertBefore(b, host.firstChild);
  }
  function poll() { if (!window.Maint) return; Maint.get().then(function (st) { show(!!st.on); }).catch(function () {}); }
  poll(); setInterval(poll, 5000);
})();
</script>
