<script>
/* ===== Jaringan HTTP FS bersama (v5): login server otomatis di semua permintaan + tulis berkas yang tahan banting ===== */
(function(){
 if(window.gdPut)return;
 var K='gd-auth';
 try{var _o=JSON.parse(localStorage.getItem(K)||'null');if(_o&&_o.u==='beldua'&&_o.p==='nanda')localStorage.removeItem(K)}catch(e){}
 function b64(s){var b=new TextEncoder().encode(s),x='';for(var i=0;i<b.length;i++)x+=String.fromCharCode(b[i]);return btoa(x)}
 function cred(){try{var a=JSON.parse(localStorage.getItem(K)||'null');return a&&a.u?a:null}catch(e){return null}}
 function hdr(){var a=cred();return a?'Basic '+b64(a.u+':'+(a.p||'')):''}
 var ORG=(window.origin&&window.origin!=='null')?window.origin:location.origin;
 function same(u){try{return new URL(String(u),document.baseURI).origin===ORG}catch(e){return false}}
 window.gdB64=b64;
 var _f=window.fetch.bind(window);
 window.fetch=function(input,init){
  try{
   var url=typeof input==='string'?input:((input&&input.url)||String(input));
   var h=hdr();
   if(h&&same(url)){
    init=Object.assign({},init||{});
    var hd=new Headers(init.headers||(input&&input.headers)||undefined);
    if(!hd.has('Authorization'))hd.set('Authorization',h);
    init.headers=hd;
   }
  }catch(e){}
  return _f(input,init);
 };
 var _o2=XMLHttpRequest.prototype.open,_s=XMLHttpRequest.prototype.send;
 XMLHttpRequest.prototype.open=function(m,u){this._gdSame=same(u);return _o2.apply(this,arguments)};
 XMLHttpRequest.prototype.send=function(){try{var h=hdr();if(this._gdSame&&h)this.setRequestHeader('Authorization',h)}catch(e){}return _s.apply(this,arguments)};
 /* alasan gagal yang bisa dibaca orang */
 window.gdWhy=function(c){c=+c;
  if(!c)return 'server tidak terjangkau';
  if(c===401)return 'server meminta login (HTTP 401) — simpan nama pengguna & sandi di Pengaturan › Server HTTP FS';
  if(c===403)return 'tidak ada izin tulis (HTTP 403)';
  if(c===405||c===501)return 'server menolak PUT (HTTP '+c+'), aktifkan izin tulis/unggah di aplikasi HTTP FS';
  if(c===404||c===409)return 'folder tujuan tidak ada (HTTP '+c+')';
  if(c===413)return 'file terlalu besar (HTTP 413)';
  if(c===507)return 'storage server penuh (HTTP 507)';
  return 'HTTP '+c};
 window.gdMkdirs=async function(dir){
  try{var u=new URL(dir,document.baseURI),segs=u.pathname.split('/').filter(Boolean),q='';
   for(var i=0;i<segs.length;i++){q+='/'+segs[i];try{await fetch(u.origin+q+'/',{method:'MKCOL',cache:'no-store'})}catch(e){}}
  }catch(e){}
 };
 /* tulis berkas: PUT -> MKCOL+PUT -> (server tanpa PUT) hapus lama + upload multipart; hasil {ok,st,how} */
 window.gdPut=async function(dir,name,body,type){
  if(dir.charAt(dir.length-1)!=='/')dir+='/';
  var url=dir+encodeURIComponent(name),ok=function(c){return c>=200&&c<300},ct=type||'application/octet-stream';
  var put=async function(){try{return (await fetch(url,{method:'PUT',headers:{'Content-Type':ct},body:body,cache:'no-store'})).status}catch(e){return 0}};
  var st=await put();if(ok(st))return{ok:true,st:st,how:'PUT'};
  if(st===404||st===409){await window.gdMkdirs(dir);st=await put();if(ok(st))return{ok:true,st:st,how:'PUT'}}
  if(st===0||st===401||st===413||st===507)return{ok:false,st:st};
  try{
   var ex=false;try{ex=(await fetch(url,{method:'HEAD',cache:'no-store'})).ok}catch(e){}
   if(ex){try{await fetch(url,{method:'DELETE',cache:'no-store'})}catch(e){}}
   var fd=new FormData();fd.append('file',new Blob([body],{type:ct}),name);
   var r=await fetch(dir,{method:'POST',body:fd,cache:'no-store'});
   if(ok(r.status)){var v=true;try{v=(await fetch(url,{method:'HEAD',cache:'no-store'})).ok}catch(e){}if(v)return{ok:true,st:r.status,how:'POST'}}
  }catch(e){}
  return{ok:false,st:st};
 };
})();

<script>
/* maint.js v2 — mode maintenance global untuk server HTTP FS (disimpan di server: RADEN/)
   Saat ON: hanya admin yang boleh login; user yang sudah login melihat pesan maintenance.
   Perbaikan v2 (penyebab maintenance gagal di HTTP FS):
   1. Tulis status lewat PUT; bila server menolak (405/501/403…), otomatis upload multipart (POST) seperti login.html.
   2. Upload multipart tidak bisa menimpa berkas, jadi status juga ditulis sebagai berkas BARU
      maint_<waktu>_<1|0>.json; pembaca memilih yang paling baru (tanpa PUT/DELETE pun tetap jalan).
   3. Tulis & baca di SEMUA folder kandidat yang berisi RADEN/, lalu ambil yang TERBARU,
      sehingga setiap perangkat melihat status yang sama walau folder induknya terdeteksi berbeda.
   4. Daftar berkas dibaca lewat PROPFIND (dengan body XML), cadangan: halaman indeks folder HTML.
   Admin tidak terpengaruh. Jika server tidak bisa dijangkau, status terakhir yang dipakai. */
(function (g) {
  "use strict";
  var BASE = null;   // folder induk RADEN/ (absolut, diakhiri /), ditemukan otomatis
  var ADMIN = ["admin@gmail.com", "ozaacrew@gmail.com"];
  var IG_URL = "https://www.instagram.com/iniozaa._/";
  var state = { on: false, by: "", at: 0 }, timer = null, lastDiag = "", liveC = { t: 0, l: [] };
  var PQ = '<?xml version="1.0" encoding="utf-8"?><d:propfind xmlns:d="DAV:"><d:prop><d:resourcetype/></d:prop></d:propfind>';

  // Kredensial server HTTP FS (disimpan dashboard di gd-auth, satu origin dengan semua halaman)
  function authHeaders(h) {
    h = h || {};
    try {
      var a = JSON.parse(localStorage.getItem("gd-auth") || "null");
      if (a && a.u) {
        var bytes = new TextEncoder().encode(a.u + ":" + (a.p || "")), x = "";
        for (var i = 0; i < bytes.length; i++) x += String.fromCharCode(bytes[i]);
        h.Authorization = "Basic " + btoa(x);
      }
    } catch (e) {}
    return h;
  }
  function _fetch(url, init) {
    init = init || {};
    init.headers = authHeaders(init.headers);
    if (!init.cache) init.cache = "no-store";
    return fetch(url, init);
  }
  function low(s) { return String(s || "").trim().toLowerCase(); }
  function isAdmin(e) { return ADMIN.indexOf(low(e)) >= 0; }
  function okc(c) { return c >= 200 && c < 300; }
  function code(m, u, init) {
    init = init || {}; init.method = m;
    return _fetch(u, init).then(function (r) { return r.status; }, function () { return 0; });
  }

  // MKCOL per tingkat folder (405/301 = sudah ada, diabaikan)
  function mkdirs(dir) {
    var u;
    try { u = new URL(dir, location.href); } catch (e) { return Promise.resolve(); }
    var parts = u.pathname.split("/").filter(Boolean), cur = "/", chain = Promise.resolve();
    parts.forEach(function (p) {
      cur += p + "/";
      var t = u.origin + cur;
      chain = chain.then(function () { return code("MKCOL", t); });
    });
    return chain;
  }

  // Kandidat folder induk: yang pernah dipakai, folder halaman ini, lalu path server dari Pengaturan
  function candidates() {
    var out = [];
    /* server yang sama tampil di dua jalur: /files/ (hanya baca) dan /webdav/ (bisa ditulis).
       Semua kandidat dialihkan ke /webdav/ agar tulisan status maintenance tidak gagal 404 di HP. */
    function add(u) { if (!u) return; u = String(u).replace(/\/files\//, "/webdav/"); if (out.indexOf(u) < 0) out.push(u); }
    ["pa-base", "rd-wdir"].forEach(function (k) {
      try { var c = localStorage.getItem(k); if (c) { c = String(c); add(c.charAt(c.length - 1) === "/" ? c : c + "/"); } } catch (e) {}
    });
    try { add(new URL("./", location.href).href); } catch (e) {}
    ["rd-srv-path", "sr-path"].forEach(function (k) {
      try {
        var p = localStorage.getItem(k);
        if (!p) return;
        add(new URL(String(p).replace(/\\/g, "/").replace(/\/?$/, "/"), location.origin + "/").href);
      } catch (e) {}
    });
    try { add(location.origin + "/webdav/"); } catch (e) {}
    return out;
  }

  function probe(base) {
    return _fetch(base + "RADEN/", { method: "PROPFIND", headers: { Depth: "0", "Content-Type": "application/xml" }, body: PQ })
      .then(function (r) { return r.status === 207 || r.status === 200; })
      .catch(function () { return false; });
  }

  // Temukan folder induk yang berisi RADEN/ dan simpan untuk semua halaman
  function resolve() {
    if (BASE) return Promise.resolve(BASE);
    var list = candidates();
    var chain = Promise.resolve(null);
    list.forEach(function (c) {
      chain = chain.then(function (found) { return found || probe(c).then(function (ok) { return ok ? c : null; }); });
    });
    return chain.then(function (found) {
      if (found) return found;
      // belum ada RADEN/: buat di kandidat pertama yang bisa ditulisi
      var tries = Promise.resolve(null);
      list.forEach(function (c) {
        tries = tries.then(function (done) {
          if (done) return done;
          return mkdirs(c + "RADEN/").then(function () { return probe(c); }).then(function (ok) { return ok ? c : null; });
        });
      });
      return tries.then(function (d) { return d || (list[0] || location.href); });
    }).then(function (b) {
      BASE = b;
      try { localStorage.setItem("pa-base", b); } catch (e) {}
      return BASE;
    });
  }

  function file() { return (BASE || "") + "RADEN/maintenance.json"; }
  function dirRaden() { return (BASE || "") + "RADEN/"; }

  // Semua folder RADEN/ yang benar-benar ada (BASE lebih dulu); di-cache 30 detik
  function liveDirs() {
    if (Date.now() - liveC.t < 30000 && liveC.l.length) return Promise.resolve(liveC.l);
    return resolve().then(function () {
      var others = candidates().filter(function (c) { return c !== BASE; });
      return Promise.all(others.map(function (c) { return probe(c); })).then(function (oks) {
        var l = [BASE + "RADEN/"];
        others.forEach(function (c, i) { if (oks[i]) l.push(c + "RADEN/"); });
        liveC = { t: Date.now(), l: l };
        return l;
      });
    });
  }

  // Daftar berkas status maint_<waktu>_<1|0>.json di satu folder (PROPFIND, cadangan: indeks HTML)
  function listEvents(rd) {
    function parse(t) {
      var re = /maint_(\d{10,})_([01])\.json/g, m, seen = {}, out = [];
      while ((m = re.exec(t))) { if (!seen[m[0]]) { seen[m[0]] = 1; out.push({ at: +m[1], on: m[2] === "1", name: m[0] }); } }
      return out;
    }
    return _fetch(rd, { method: "PROPFIND", headers: { Depth: "1", "Content-Type": "application/xml" }, body: PQ })
      .then(function (r) { return r.ok ? r.text() : ""; }, function () { return ""; })
      .then(function (t) {
        var ev = parse(t);
        if (ev.length) return ev;
        return _fetch(rd).then(function (r) { return r.ok ? r.text() : ""; }, function () { return ""; }).then(parse);
      });
  }

  // Baca satu folder: berkas maintenance.json + berkas status; ambil yang terbaru
  function readDir(rd) {
    var best = null, reach = false;
    function take(s) { if (s && (!best || s.at >= best.at)) best = s; }
    return _fetch(rd + "maintenance.json").then(function (r) {
      if (r.status === 404 || r.status === 405) { reach = true; return null; }
      if (!r.ok) return null;
      reach = true;
      return r.json().then(function (j) { return { on: !!(j && j.on), by: (j && j.by) || "", at: +(j && j.at) || 0 }; }, function () { return null; });
    }, function () { return null; }).then(function (s) {
      take(s);
      return listEvents(rd);
    }).then(function (ev) {
      if (ev.length) reach = true;
      ev.forEach(function (e) { take({ on: e.on, by: "", at: e.at }); });
      return { reach: reach, rec: best };
    });
  }

  function get() {
    return liveDirs().then(function (dirs) { return Promise.all(dirs.map(readDir)); }).then(function (rs) {
      var any = false, best = null;
      rs.forEach(function (x) { if (x.reach) any = true; if (x.rec && (!best || x.rec.at >= best.at)) best = x.rec; });
      if (!any) throw new Error("server tidak terjangkau");
      var s = best || { on: false, by: "", at: 0 };
      state = { on: !!s.on, by: s.by || "", at: s.at || 0 };
      try { localStorage.setItem("pa-maint", JSON.stringify(state)); } catch (e) {}
      return state;
    }).catch(function () {
      // server tidak bisa diakses: pakai status terakhir yang tersimpan di browser ini
      try { var c = JSON.parse(localStorage.getItem("pa-maint") || "null"); if (c) state = c; } catch (e) {}
      return state;
    });
  }

  // Tulis ke satu folder: PUT maintenance.json → (MKCOL+PUT) → upload multipart berkas baru
  function writeDir(rd, st) {
    var body = JSON.stringify(st), name = "maint_" + st.at + "_" + (st.on ? 1 : 0) + ".json", trail = [], last = 0;
    function put() {
      return code("PUT", rd + "maintenance.json", { headers: { "Content-Type": "application/json" }, body: body }).then(function (c) { trail.push("PUT " + c); last = c; return c; });
    }
    function post() {
      var fd = new FormData();
      fd.append("file", new Blob([body], { type: "application/json" }), name);
      return code("POST", rd, { body: fd }).then(function (c) { trail.push("POST " + c); last = c || last; return c; });
    }
    function verify() { return code("GET", rd + name).then(function (c) { return okc(c); }); }
    function done(how, ok) { return { ok: ok, how: how, st: last, dir: rd, trail: trail.join(", ") }; }
    return put().then(function (c) {
      if (okc(c)) return done("PUT", true);
      var again = (c === 404 || c === 409) ? mkdirs(rd).then(put) : Promise.resolve(c);
      return again.then(function (c2) {
        if (okc(c2)) return done("PUT", true);
        return post().then(function (p) {
          var re = (p === 404 || p === 409) ? mkdirs(rd).then(post) : Promise.resolve(p);
          return re.then(function (p2) {
            if (!okc(p2)) return done("POST", false);
            return verify().then(function (v) { return done("POST", v); });
          });
        });
      });
    });
  }

  // Hapus berkas status lama (opsional; gagal diabaikan)
  function tidy(rd, keepAt) {
    return listEvents(rd).then(function (ev) {
      return Promise.all(ev.filter(function (e) { return e.at < keepAt; }).map(function (e) { return code("DELETE", rd + e.name); }));
    }).catch(function () {});
  }

  function set(on, by) {
    var st = { on: !!on, by: low(by), at: Date.now() };
    return liveDirs().then(function (dirs) { return Promise.all(dirs.map(function (d) { return writeDir(d, st); })); }).then(function (rs) {
      lastDiag = rs.map(function (r) { return (r.ok ? "✔ " : "✘ ") + r.trail; }).join(" | ");
      var good = rs.filter(function (r) { return r.ok; });
      if (!good.length) {
        var c = 0;
        rs.forEach(function (r) { var s = r.st; if (s === 401 || s === 403) c = s; else if (!c && s) c = s; });
        liveC.t = 0;
        throw new Error("HTTP " + c + " (" + lastDiag + ")");
      }
      state = st;
      try { localStorage.setItem("pa-maint", JSON.stringify(st)); } catch (e) {}
      good.forEach(function (r) { tidy(r.dir, st.at); });
      return st;
    });
  }

  function mount(el) { (document.body || document.documentElement).appendChild(el); }

  function overlay() {
    if (document.getElementById("maintOv")) return;
    var st = document.createElement("style");
    st.textContent =
      "#maintOv{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:rgba(7,11,26,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Arial,sans-serif;color:#f4f5f8}" +
      "#maintOv .mt-card{max-width:440px;width:100%;text-align:center;padding:32px 28px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.26);box-shadow:0 30px 70px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.4)}" +
      "#maintOv h1{margin:0 0 14px;font-size:24px;font-weight:700;letter-spacing:-.01em}" +
      "#maintOv p{margin:0 0 18px;font-size:16px;color:rgba(244,245,248,.78)}" +
      "#maintOv .mt-ig{display:inline-flex;align-items:center;gap:0;font-size:17px;font-weight:600;color:#fff;text-decoration:none;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}" +
      "#maintOv .mt-ig svg{display:block;width:22px;height:22px;margin:0;flex:0 0 22px}" +
      "#maintOv .mt-ig span{display:inline-block;margin:0;padding:0;line-height:22px}";
    var d = document.createElement("div");
    d.id = "maintOv"; d.setAttribute("role", "alertdialog"); d.setAttribute("aria-live", "assertive");
    d.innerHTML = '<div class="mt-card"><h1>Sistem sedang maintenance</h1><p>silahkan cek pembaruan di</p>' +
      '<a class="mt-ig" href="' + IG_URL + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.4" cy="6.6" r="1.4" fill="currentColor"/></svg><span>@iniozaa._</span></a></div>';
    document.head.appendChild(st);
    mount(d);
    document.documentElement.style.overflow = "hidden";
  }

  function unmask() {
    var d = document.getElementById("maintOv");
    if (d) d.remove();
    document.documentElement.style.overflow = "";
  }

  // Terapkan status ke halaman untuk email tertentu
  function apply(st, email) {
    if (st.on && !isAdmin(email)) overlay(); else unmask();
  }

  function gate(email) {
    return get().then(function (st) { apply(st, email); return st.on && !isAdmin(email); });
  }

  // Pantau terus: user yang sudah login melihat pesan saat maintenance aktif
  function watch(email) {
    if (timer) clearInterval(timer);
    var run = function () { get().then(function (st) { apply(st, email); }); };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
    timer = setInterval(run, 5000);
  }

  g.Maint = {
    ADMIN: ADMIN, isAdmin: isAdmin, get: get, set: set, resolve: resolve, base: function () { return BASE; }, overlay: overlay,
    unmask: unmask, gate: gate, watch: watch, state: function () { return state; }, diag: function () { return lastDiag; }
  };
})(window);

</script>
<script>
/* presence.js v2
   Sesi per perangkat, status online, last seen, logout perangkat lain (segera).
   Struktur di server (WebDAV, relatif terhadap halaman):
     RADEN/sessions/<email>__<device>.json  -> satu file per perangkat yang sedang login
     RADEN/presence/<email>.json            -> last seen per user
   Perubahan:
   - MKCOL dibuat per tingkat folder (RADEN/, lalu RADEN/sessions/); PUT diulang setelah folder dibuat.
   - Pemeriksaan pencabutan setiap 3 detik. Tab di browser yang sama menerima pencabutan seketika (event storage).
   - EPOCH: bila nilai berubah, semua perangkat wajib login ulang.
*/
(function (g) {
  "use strict";

  var EPOCH = "relogin-2";           // ganti nilai ini untuk memaksa semua perangkat login ulang
  var CFG = {
    base: "RADEN/sessions/",
    users: "RADEN/presence/",
    checkMs: 1000,                   // pemeriksaan pencabutan (1 detik)
    beatMs: 20000,                   // interval menulis heartbeat
    onlineMs: 60000                  // online bila heartbeat < 60 detik
  };
  var lastErr = "";
  var ROOT = "";   // folder induk RADEN/ (absolut), diisi dari Maint.resolve()
  function sessDir() { return ROOT + CFG.base; }
  function usrDir() { return ROOT + CFG.users; }
  function ready() {
    if (!window.Maint || !Maint.resolve) return Promise.resolve();
    return Maint.resolve().then(function (b) { ROOT = b || ""; });
  }
  var KDEV = "pa-device", KEPOCH = "pa-epoch", KKICK = "pa-kick";
  var timer = null, me = null, onRevokeCb = null, hooked = false, lastBeat = 0, busy = false;

  // Kredensial server HTTP FS (disimpan dashboard di gd-auth, satu origin dengan semua halaman)
  function authHeaders(h) {
    h = h || {};
    try {
      var a = JSON.parse(localStorage.getItem("gd-auth") || "null");
      if (a && a.u) {
        var bytes = new TextEncoder().encode(a.u + ":" + (a.p || "")), x = "";
        for (var i = 0; i < bytes.length; i++) x += String.fromCharCode(bytes[i]);
        h.Authorization = "Basic " + btoa(x);
      }
    } catch (e) {}
    return h;
  }
  function _fetch(url, init) {
    init = init || {};
    init.headers = authHeaders(init.headers);
    return fetch(url, init);
  }
  function low(s) { return String(s || "").trim().toLowerCase(); }

  function deviceId() {
    var d = null;
    try { d = localStorage.getItem(KDEV); } catch (e) {}
    if (!d) {
      d = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try { localStorage.setItem(KDEV, d); } catch (e) {}
    }
    return d;
  }

  function deviceName(ua) {
    ua = String(ua || navigator.userAgent || "");
    if (/iPhone/.test(ua)) return "iPhone";
    if (/iPad/.test(ua)) return "iPad";
    if (/Android/.test(ua)) return "Android";
    if (/Windows/.test(ua)) return "Windows";
    if (/Macintosh|Mac OS/.test(ua)) return "Mac";
    if (/Linux/.test(ua)) return "Linux";
    return "Perangkat";
  }

  function fileName(email, dev) {
    return email.replace(/[^a-z0-9._-]/g, "_") + "__" + dev + ".json";
  }

  function dirOf(url) { return url.slice(0, url.lastIndexOf("/") + 1); }

  // Membuat setiap tingkat folder: RADEN/ lalu RADEN/sessions/ (405 = sudah ada, diabaikan)
  function mkcolPath(dir) {
    var u = new URL(dir, location.href);
    var parts = u.pathname.split("/").filter(Boolean), cur = "/", chain = Promise.resolve();
    parts.forEach(function (p) {
      cur += p + "/";
      var target = u.origin + cur;
      chain = chain.then(function () {
        return _fetch(target, { method: "MKCOL", cache: "no-store" }).catch(function () {});
      });
    });
    return chain;
  }

  function put(url, obj, keep) {
    var body = JSON.stringify(obj);
    function send() {
      return _fetch(url, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: body,
        cache: "no-store",
        keepalive: !!keep
      });
    }
    return send().then(function (r) {
      if (r.ok) return r;
      return mkcolPath(dirOf(url)).then(send);   // folder belum ada: buat lalu ulangi
    }).then(function (r) {
      lastErr = r.ok ? "" : "PUT " + url + " → HTTP " + r.status;
      return r;
    });
  }

  // null bila file tidak ada (404)
  function getJson(url) {
    return _fetch(url, { cache: "no-store" }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function listNames(dir) {
    return _fetch(dir, { method: "PROPFIND", headers: { Depth: "1" }, cache: "no-store" })
      .then(function (r) {
        if (!r.ok) { lastErr = "PROPFIND " + dir + " → HTTP " + r.status; return ""; }
        lastErr = ""; return r.text();
      })
      .then(function (t) {
        var re = /<(?:[a-zA-Z]+:)?href>([^<]+)<\/(?:[a-zA-Z]+:)?href>/g, m, out = [];
        while ((m = re.exec(t))) {
          var n = decodeURIComponent(m[1]).split("/").filter(Boolean).pop();
          if (n && /\.json$/i.test(n)) out.push(n);
        }
        return out;
      })
      .catch(function (e) { lastErr = "jaringan: " + (e && e.message ? e.message : "gagal"); return []; });
  }

  // Pemeriksaan berkala: cek pencabutan, dan tulis heartbeat bila sudah waktunya
  function check() {
    if (!me || busy) return;
    busy = true;
    var url = sessDir() + me.file;
    getJson(url).then(function (rec) {
      if (!me) return;
      if (!me.confirmed) {                          // file belum pernah tercipta: buat sekarang
        return put(url, me.rec).then(function (r) {
          if (r.ok && me) { me.confirmed = true; }
        });
      }
      if (!rec || rec.revoked) { stop(true); return; }   // dihapus / dicabut dari perangkat lain
      if (Date.now() - lastBeat >= CFG.beatMs) {
        lastBeat = Date.now();
        me.rec.seen = lastBeat;
        return put(url, me.rec).then(function () {
          return put(usrDir() + me.email + ".json", { email: me.email, lastSeen: lastBeat });
        });
      }
    }).catch(function () { /* gangguan jaringan: jangan logout */ })
      .then(function () { busy = false; });
  }

  function offline() {
    if (!me) return;
    me.rec.seen = 0;
    put(sessDir() + me.file, me.rec, true);
    put(usrDir() + me.email + ".json", { email: me.email, lastSeen: Date.now() }, true);
  }

  function onStorage(e) {
    if (!me || e.key !== KKICK || !e.newValue) return;
    try { if (JSON.parse(e.newValue).file === me.file) stop(true); } catch (err) {}
  }

  function start(email, name, onRevoked) {
    email = low(email);
    if (!email) return Promise.resolve(false);
    stop(false);
    var now = Date.now(), dev = deviceId();
    me = {
      email: email,
      file: fileName(email, dev),
      confirmed: false,
      rec: { email: email, name: String(name || email), device: dev, deviceName: deviceName(),
             ua: navigator.userAgent, started: now, seen: now, revoked: false }
    };
    lastBeat = now;
    onRevokeCb = typeof onRevoked === "function" ? onRevoked : null;
    if (!hooked) {
      hooked = true;
      addEventListener("pagehide", offline);
      addEventListener("storage", onStorage);
    }
    timer = setInterval(check, CFG.checkMs);
    return ready().then(function () { return mkcolPath(sessDir()); })
      .then(function () { return mkcolPath(usrDir()); })
      .then(function () { return put(sessDir() + me.file, me.rec); })
      .then(function (r) {
        if (me && r.ok) me.confirmed = true;
        return put(usrDir() + email + ".json", { email: email, lastSeen: now });
      })
      .then(function () { return !!(me && me.confirmed); })
      .catch(function () { return false; });
  }

  // notify = true bila dicabut dari perangkat lain (dipanggil onRevoked)
  function stop(notify) {
    clearInterval(timer); timer = null;
    var cb = onRevokeCb;
    if (me && !notify) {
      put(usrDir() + me.email + ".json", { email: me.email, lastSeen: Date.now() }, true);
      _fetch(sessDir() + me.file, { method: "DELETE", keepalive: true, cache: "no-store" }).catch(function () {});
    }
    me = null; onRevokeCb = null;
    if (notify && cb) cb();
  }

  function list() {
    return ready().then(function () { return listNames(sessDir()); }).then(function (names) {
      return Promise.all(names.map(function (n) {
        return getJson(sessDir() + n).catch(function () { return null; });
      }));
    }).then(function (recs) {
      var now = Date.now(), byUser = {};
      recs.forEach(function (r) {
        if (!r || r.revoked || !r.email) return;
        var u = byUser[r.email] || (byUser[r.email] = {
          email: r.email, name: r.name || r.email, devices: [], lastSeen: 0, online: false
        });
        var online = !!r.seen && now - r.seen < CFG.onlineMs;
        u.devices.push({
          device: r.device, deviceName: r.deviceName || "Perangkat",
          file: fileName(r.email, r.device), seen: r.seen || 0, online: online
        });
        u.lastSeen = Math.max(u.lastSeen, r.seen || 0);
        u.online = u.online || online;
      });
      return Object.keys(byUser).map(function (k) { return byUser[k]; });
    });
  }

  function lastSeenAll() {
    return ready().then(function () { return listNames(usrDir()); }).then(function (names) {
      return Promise.all(names.map(function (n) {
        return getJson(usrDir() + n).catch(function () { return null; });
      }));
    }).then(function (arr) {
      var o = {};
      arr.forEach(function (r) { if (r && r.email) o[r.email] = r.lastSeen || 0; });
      return o;
    });
  }

  // Cabut perangkat lain: tandai dicabut, kirim sinyal ke tab di browser yang sama, lalu hapus filenya
  function revoke(file) {
    return ready().then(function () { return revokeNow(file); });
  }
  function revokeNow(file) {
    var url = sessDir() + file;
    try { localStorage.setItem(KKICK, JSON.stringify({ file: file, t: Date.now() })); } catch (e) {}
    return getJson(url).then(function (rec) {
      if (!rec) return null;
      rec.revoked = true;
      return put(url, rec);
    }).then(function () {
      return _fetch(url, { method: "DELETE", cache: "no-store" }).catch(function () {});
    }).then(function () { return true; });
  }

  function status() { return { err: lastErr, root: ROOT }; }

  function epochOk() {
    try { return localStorage.getItem(KEPOCH) === EPOCH; } catch (e) { return true; }
  }
  function markEpoch() {
    try { localStorage.setItem(KEPOCH, EPOCH); } catch (e) {}
  }

  function avatarFor(email, name) {
    var s = low(email), h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    var letter = (String(name || email).trim().charAt(0) || "?").toUpperCase();
    return { letter: letter, hue: h, bg: "hsl(" + h + " 70% 55%)" };
  }

  function configure(opts) {
    if (opts) for (var k in opts) if (k in CFG) CFG[k] = opts[k];
  }

  g.Presence = {
    configure: configure, start: start, stop: stop, list: list,
    lastSeenAll: lastSeenAll, revoke: revoke, avatarFor: avatarFor,
    deviceId: deviceId, epochOk: epochOk, markEpoch: markEpoch, status: status
  };
})(window);

</script>

/* buttons / inputs */
.btn{height:40px;padding:0 22px;border-radius:20px;background:var(--primary);color:var(--on-primary);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.tonal{background:var(--sec);color:var(--on-sec)}
.btn:active{filter:brightness(.92)}
.field{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--outline);background:transparent;color:var(--text);padding:0 14px;font:inherit;font-size:16px}
.sel{height:40px;border-radius:10px;border:1px solid var(--outline);background:var(--sc);color:var(--text);padding:0 10px;font:inherit;font-size:15px}

/* settings */
.set-card{background:var(--sc);border-radius:28px;padding:6px 20px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--outline-v)}
.row:last-child{border-bottom:0}
.row.col{flex-direction:column;align-items:stretch;gap:12px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:16px}
.row .t small{display:block;color:var(--text2);font-size:13px;line-height:1.35}
.row .line{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden;align-self:flex-start}
.seg button{padding:0 16px;height:36px;font-size:14px}
.seg button+button{border-left:1px solid var(--outline)}
.seg button.on{background:var(--sec);color:var(--on-sec);font-weight:600}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--sch);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:.2s}
.sw[aria-checked=true]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked=true]::after{left:22px;width:24px;height:24px;background:var(--on-primary)}
.dots{display:flex;gap:10px;flex-wrap:wrap}
.dot{width:40px;height:40px;border-radius:50%;border:3px solid transparent;display:grid;place-items:center;color:#fff;background-clip:padding-box}
.dot.on{box-shadow:0 0 0 2px var(--text)}
.about p{font-size:14px;color:var(--text2);margin:10px 0}
.about code{background:var(--sch);padding:1px 6px;border-radius:6px;font-size:13px}

/* viewer */
#viewer{position:fixed;inset:0;z-index:100;background:#000;color:#fff;touch-action:none;overscroll-behavior:contain}
#vstage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#vstage img,#vstage video{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;-webkit-user-drag:none;user-select:none}
#vstage img{transform-origin:center center;will-change:transform}
#vstage video{background:#000}
#vstage .enter{animation:fin .22s ease-out}
@keyframes fin{from{opacity:0}to{opacity:1}}
.v-top{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top) + 6px) 8px 28px;background:linear-gradient(rgba(0,0,0,.72),transparent);transition:opacity .2s;pointer-events:none}
.v-top>*{pointer-events:auto}
.v-top .icon-btn{color:#fff}
.v-top .icon-btn:hover{background:rgba(255,255,255,.14)}
.v-title{flex:1;min-width:0;padding:0 6px;pointer-events:none}
.v-title b{display:block;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-title small{display:block;opacity:.72;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-nav{position:absolute;top:50%;z-index:3;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:none;place-items:center;transition:opacity .2s}
.v-nav:hover{background:rgba(0,0,0,.75)}
.v-nav:disabled{opacity:0;pointer-events:none}
@media(hover:hover) and (pointer:fine){.v-nav{display:grid}}
#viewer.chrome-off .v-top,#viewer.chrome-off .v-nav{opacity:0;pointer-events:none}
#viewer.chrome-off .v-top>*{pointer-events:none}
.ring{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite;z-index:2;pointer-events:none}
#verr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:2;pointer-events:none}
#verr p{max-width:420px;font-size:14px;opacity:.85}
#verr .btn{pointer-events:auto}
#verr .ic{opacity:.7}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:200;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;z-index:210;width:min(100%,600px);transform:translate(-50%,100%);background:var(--sc);color:var(--text);border-radius:28px 28px 0 0;padding:12px 24px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;transition:transform .25s cubic-bezier(.2,0,0,1)}
.sheet.show{transform:translate(-50%,0)}
.handle{width:32px;height:4px;border-radius:2px;background:var(--outline);opacity:.6;margin:0 auto 14px}
.sheet-t{font-size:20px;font-weight:500;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;height:52px;text-align:left;border-radius:16px;padding:0 8px}
.opt:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
.opt .ck{width:24px;color:var(--primary)}
.opt.on{font-weight:600}
.irow{padding:10px 0;border-bottom:1px solid var(--outline-v)}
.irow:last-child{border:0}
.irow small{display:block;color:var(--text2);font-size:12px}
.irow .v{word-break:break-all;font-size:15px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:300;min-width:min(344px,calc(100vw - 32px));max-width:calc(100vw - 32px);background:var(--text);color:var(--bg);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;transition:.25s;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{flex:1}
#toast button{font-weight:600;color:hsl(var(--h) 90% 78%)}
:root.dark #toast button{color:hsl(var(--h) 60% 32%)}

/* ===================================================================
   zilky.archive — iOS 26 "Liquid Glass"
   =================================================================== */
:root,:root.dark{
  --acc:hsl(var(--h) 100% 62%);
  --acc-soft:hsl(var(--h) 100% 74%);
  --bg:#140d0b;
  --sc:rgba(255,255,255,.13);
  --sch:rgba(255,255,255,.16);
  --primary:var(--acc);
  --on-primary:#fff;
  --pc:rgba(255,255,255,.14);
  --on-pc:#fff;
  --sec:rgba(255,255,255,.24);
  --on-sec:#fff;
  --text:#fff;
  --text2:rgba(255,255,255,.68);
  --outline:rgba(255,255,255,.45);
  --outline-v:rgba(255,255,255,.16);
  --scrim:rgba(0,0,0,.34);
  --glass-blur:blur(26px) saturate(190%) brightness(1.06);
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.27),rgba(255,255,255,.07) 55%,rgba(255,255,255,.15));
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.3);
  --glass-shadow:0 10px 34px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.14);
  --spring:cubic-bezier(.34,1.45,.5,1);
  color-scheme:dark;
}

body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(12,7,6,.46),rgba(12,7,6,.56) 50%,rgba(12,7,6,.74));
}
::selection{background:hsl(var(--h) 100% 60% / .55)}

/* ---------- permukaan kaca ---------- */
.search,.hero,.stat,.card,.set-card,.scancard,#nav,#btnRefresh,.album-head .icon-btn{
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-edge),var(--glass-shadow);
  border:0;
}
.chip,.seg,.sel,.field,.btn.tonal{
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--glass-edge);
  border:0;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .search,.hero,.stat,.card,.set-card,.scancard,#nav,#btnRefresh,.album-head .icon-btn,.chip,.seg,.sel,.field,.btn.tonal,.sheet,#toast{background:rgba(46,36,34,.82)}
}
@media (prefers-reduced-transparency:reduce){
  .search,.hero,.stat,.card,.set-card,.scancard,#nav,#btnRefresh,.album-head .icon-btn,.chip,.seg,.sel,.field,.btn.tonal,.sheet,#toast{background:rgba(46,36,34,.9);-webkit-backdrop-filter:none;backdrop-filter:none}
}

/* ---------- judul ---------- */
.page-t{font-size:34px;font-weight:700;letter-spacing:.2px;line-height:1.12;margin:10px 4px 18px;text-shadow:0 1px 14px rgba(0,0,0,.35)}
.album-head h1{font-size:28px;font-weight:700;letter-spacing:.2px}
.sec-h h2{font-size:22px;font-weight:700;letter-spacing:.1px}
.link{color:var(--acc-soft);font-weight:600}
.link:hover{background:rgba(255,255,255,.1)}

/* ---------- app bar ---------- */
.appbar{background:linear-gradient(rgba(12,7,6,.5),rgba(12,7,6,0));gap:10px;padding-bottom:12px}
.search{height:48px;border-radius:24px;padding:0 6px 0 16px;color:var(--text2)}
.search input{font-size:17px}
#btnRefresh{width:48px;height:48px;border-radius:50%;color:#fff;flex:none}
.search{min-width:0}
#btnRefresh:hover,#btnRefresh:active{background:var(--glass-bg)}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.album-head .icon-btn{width:44px;height:44px;border-radius:50%;color:#fff}
.album-head .icon-btn:hover{background:var(--glass-bg)}
.progress{background:transparent}
.progress i{background:var(--acc);box-shadow:0 0 10px var(--acc)}

/* ---------- tab bar melayang ---------- */
#nav{
  left:50%;right:auto;bottom:calc(12px + env(safe-area-inset-bottom));
  width:min(460px,calc(100% - 32px));height:68px;
  transform:translateX(-50%);
  padding:6px;gap:2px;border-radius:34px;
  align-items:center;justify-content:space-between;
}
.nav-item{
  flex:1;width:auto;max-width:none;height:56px;border-radius:28px;
  justify-content:center;gap:2px;font-size:10.5px;font-weight:500;letter-spacing:0;
  color:rgba(255,255,255,.78);
  transition:transform .4s var(--spring),background .25s;
}
.nav-item:active{transform:scale(.93)}
.nav-pill,.nav-item:hover .nav-pill,.nav-item.on .nav-pill{width:auto;height:26px;border-radius:0;background:transparent}
.nav-item.on{
  color:var(--acc-soft);font-weight:600;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.12));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 .5px rgba(255,255,255,.25),0 3px 12px rgba(0,0,0,.2);
}
main{padding-bottom:calc(124px + env(safe-area-inset-bottom))}
#toast{bottom:calc(100px + env(safe-area-inset-bottom))}

@media(min-width:840px){
  body{padding-left:116px}
  #nav{left:20px;top:50%;bottom:auto;right:auto;width:76px;height:auto;transform:translateY(-50%);flex-direction:column;justify-content:flex-start;padding:8px;gap:6px;border-radius:38px}
  .nav-item{flex:none;width:60px;height:60px}
  main{padding-bottom:48px}
}

/* ---------- beranda ---------- */
.hero{border-radius:34px;padding:26px}
.hero h1{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero p{opacity:.75}
.pill{background:rgba(255,255,255,.18);box-shadow:inset 0 .5px 0 rgba(255,255,255,.45);border-radius:999px;-webkit-backdrop-filter:none;backdrop-filter:none}
.stat{border-radius:28px}
.stat b{font-weight:700}
.stat .ic{width:38px;height:38px;border-radius:11px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.stat:nth-child(1) .ic{background:linear-gradient(180deg,#ffb340,#ff9500)}
.stat:nth-child(2) .ic{background:linear-gradient(180deg,#ff6961,#ff3b30)}
.stat:nth-child(3) .ic{background:linear-gradient(180deg,#4da3ff,#0a84ff)}
.stat:nth-child(4) .ic{background:linear-gradient(180deg,#5ee07f,#30b94f)}
.card{border-radius:30px}
.card h3{font-weight:600;font-size:17px}
.comp{background:rgba(255,255,255,.16);height:10px;border-radius:999px}
.comp i{border-radius:999px}
.xchip{background:rgba(255,255,255,.16);border-radius:999px;box-shadow:inset 0 .5px 0 rgba(255,255,255,.3)}
.scancard{border-radius:24px}

/* ---------- filter ---------- */
.chip{height:34px;padding:0 16px;border-radius:999px;font-weight:500;transition:transform .3s var(--spring)}
.chip:active{transform:scale(.94)}
.chip.on{background:#fff;color:#1c1c1e;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3)}

/* ---------- kisi foto & album ---------- */
.grid{gap:2px;border-radius:22px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.3)}
.tile{border-radius:0;background:rgba(255,255,255,.1)}
.tile:hover{border-radius:0}
.tile:active{transform:none;opacity:.8}
.skel{border-radius:0}
.hscroll{gap:6px}
.hscroll .tile{border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.hscroll .tile:hover{border-radius:18px}
.agrid{gap:22px 14px}
.album .cover{border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.38),inset 0 0 0 .5px rgba(255,255,255,.25)}
.album:hover .cover{border-radius:22px}
.album:active .cover{transform:scale(.97);transition:transform .25s var(--spring)}
.album .nm{font-weight:600;font-size:15px}
.badge{background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:2px 8px 2px 5px}
.empty .big{border-radius:50%;background:var(--glass-bg);box-shadow:var(--glass-edge)}
.empty h3{font-weight:600}

/* ---------- tombol & input ---------- */
.btn{

<script>
/* maint.js v2 — mode maintenance global untuk server HTTP FS (disimpan di server: RADEN/)
   Saat ON: hanya admin yang boleh login; user yang sudah login melihat pesan maintenance.
   Perbaikan v2 (penyebab maintenance gagal di HTTP FS):
   1. Tulis status lewat PUT; bila server menolak (405/501/403…), otomatis upload multipart (POST) seperti login.html.
   2. Upload multipart tidak bisa menimpa berkas, jadi status juga ditulis sebagai berkas BARU
      maint_<waktu>_<1|0>.json; pembaca memilih yang paling baru (tanpa PUT/DELETE pun tetap jalan).
   3. Tulis & baca di SEMUA folder kandidat yang berisi RADEN/, lalu ambil yang TERBARU,
      sehingga setiap perangkat melihat status yang sama walau folder induknya terdeteksi berbeda.
   4. Daftar berkas dibaca lewat PROPFIND (dengan body XML), cadangan: halaman indeks folder HTML.
   Admin tidak terpengaruh. Jika server tidak bisa dijangkau, status terakhir yang dipakai. */
(function (g) {
  "use strict";
  var BASE = null;   // folder induk RADEN/ (absolut, diakhiri /), ditemukan otomatis
  var ADMIN = ["admin@gmail.com", "ozaacrew@gmail.com"];
  var IG_URL = "https://www.instagram.com/iniozaa._/";
  var state = { on: false, by: "", at: 0 }, timer = null, lastDiag = "", liveC = { t: 0, l: [] };
  var PQ = '<?xml version="1.0" encoding="utf-8"?><d:propfind xmlns:d="DAV:"><d:prop><d:resourcetype/></d:prop></d:propfind>';

  // Kredensial server HTTP FS (disimpan dashboard di gd-auth, satu origin dengan semua halaman)
  function authHeaders(h) {
    h = h || {};
    try {
      var a = JSON.parse(localStorage.getItem("gd-auth") || "null");
      if (a && a.u) {
        var bytes = new TextEncoder().encode(a.u + ":" + (a.p || "")), x = "";
        for (var i = 0; i < bytes.length; i++) x += String.fromCharCode(bytes[i]);
        h.Authorization = "Basic " + btoa(x);
      }
    } catch (e) {}
    return h;
  }
  function _fetch(url, init) {
    init = init || {};
    init.headers = authHeaders(init.headers);
    if (!init.cache) init.cache = "no-store";
    return fetch(url, init);
  }
  function low(s) { return String(s || "").trim().toLowerCase(); }
  function isAdmin(e) { return ADMIN.indexOf(low(e)) >= 0; }
  function okc(c) { return c >= 200 && c < 300; }
  function code(m, u, init) {
    init = init || {}; init.method = m;
    return _fetch(u, init).then(function (r) { return r.status; }, function () { return 0; });
  }

  // MKCOL per tingkat folder (405/301 = sudah ada, diabaikan)
  function mkdirs(dir) {
    var u;
    try { u = new URL(dir, location.href); } catch (e) { return Promise.resolve(); }
    var parts = u.pathname.split("/").filter(Boolean), cur = "/", chain = Promise.resolve();
    parts.forEach(function (p) {
      cur += p + "/";
      var t = u.origin + cur;
      chain = chain.then(function () { return code("MKCOL", t); });
    });
    return chain;
  }

  // Kandidat folder induk: yang pernah dipakai, folder halaman ini, lalu path server dari Pengaturan
  function candidates() {
    var out = [];
    /* server yang sama tampil di dua jalur: /files/ (hanya baca) dan /webdav/ (bisa ditulis).
       Semua kandidat dialihkan ke /webdav/ agar tulisan status maintenance tidak gagal 404 di HP. */
    function add(u) { if (!u) return; u = String(u).replace(/\/files\//, "/webdav/"); if (out.indexOf(u) < 0) out.push(u); }
    ["pa-base", "rd-wdir"].forEach(function (k) {
      try { var c = localStorage.getItem(k); if (c) { c = String(c); add(c.charAt(c.length - 1) === "/" ? c : c + "/"); } } catch (e) {}
    });
    try { add(new URL("./", location.href).href); } catch (e) {}
    ["rd-srv-path", "sr-path"].forEach(function (k) {
      try {
        var p = localStorage.getItem(k);
        if (!p) return;
        add(new URL(String(p).replace(/\\/g, "/").replace(/\/?$/, "/"), location.origin + "/").href);
      } catch (e) {}
    });
    try { add(location.origin + "/webdav/"); } catch (e) {}
    return out;
  }

  function probe(base) {
    return _fetch(base + "RADEN/", { method: "PROPFIND", headers: { Depth: "0", "Content-Type": "application/xml" }, body: PQ })
      .then(function (r) { return r.status === 207 || r.status === 200; })
      .catch(function () { return false; });
  }

  // Temukan folder induk yang berisi RADEN/ dan simpan untuk semua halaman
  function resolve() {
    if (BASE) return Promise.resolve(BASE);
    var list = candidates();
    var chain = Promise.resolve(null);
    list.forEach(function (c) {
      chain = chain.then(function (found) { return found || probe(c).then(function (ok) { return ok ? c : null; }); });
    });
    return chain.then(function (found) {
      if (found) return found;
      // belum ada RADEN/: buat di kandidat pertama yang bisa ditulisi
      var tries = Promise.resolve(null);
      list.forEach(function (c) {
        tries = tries.then(function (done) {
          if (done) return done;
          return mkdirs(c + "RADEN/").then(function () { return probe(c); }).then(function (ok) { return ok ? c : null; });
        });
      });
      return tries.then(function (d) { return d || (list[0] || location.href); });
    }).then(function (b) {
      BASE = b;
      try { localStorage.setItem("pa-base", b); } catch (e) {}
      return BASE;
    });
  }

  function file() { return (BASE || "") + "RADEN/maintenance.json"; }
  function dirRaden() { return (BASE || "") + "RADEN/"; }

  // Semua folder RADEN/ yang benar-benar ada (BASE lebih dulu); di-cache 30 detik
  function liveDirs() {
    if (Date.now() - liveC.t < 30000 && liveC.l.length) return Promise.resolve(liveC.l);
    return resolve().then(function () {
      var others = candidates().filter(function (c) { return c !== BASE; });
      return Promise.all(others.map(function (c) { return probe(c); })).then(function (oks) {
        var l = [BASE + "RADEN/"];
        others.forEach(function (c, i) { if (oks[i]) l.push(c + "RADEN/"); });
        liveC = { t: Date.now(), l: l };
        return l;
      });
    });
  }

  // Daftar berkas status maint_<waktu>_<1|0>.json di satu folder (PROPFIND, cadangan: indeks HTML)
  function listEvents(rd) {
    function parse(t) {
      var re = /maint_(\d{10,})_([01])\.json/g, m, seen = {}, out = [];
      while ((m = re.exec(t))) { if (!seen[m[0]]) { seen[m[0]] = 1; out.push({ at: +m[1], on: m[2] === "1", name: m[0] }); } }
      return out;
    }
    return _fetch(rd, { method: "PROPFIND", headers: { Depth: "1", "Content-Type": "application/xml" }, body: PQ })
      .then(function (r) { return r.ok ? r.text() : ""; }, function () { return ""; })
      .then(function (t) {
        var ev = parse(t);
        if (ev.length) return ev;
        return _fetch(rd).then(function (r) { return r.ok ? r.text() : ""; }, function () { return ""; }).then(parse);
      });
  }

  // Baca satu folder: berkas maintenance.json + berkas status; ambil yang terbaru
  function readDir(rd) {
    var best = null, reach = false;
    function take(s) { if (s && (!best || s.at >= best.at)) best = s; }
    return _fetch(rd + "maintenance.json").then(function (r) {
      if (r.status === 404 || r.status === 405) { reach = true; return null; }
      if (!r.ok) return null;
      reach = true;
      return r.json().then(function (j) { return { on: !!(j && j.on), by: (j && j.by) || "", at: +(j && j.at) || 0 }; }, function () { return null; });
    }, function () { return null; }).then(function (s) {
      take(s);
      return listEvents(rd);
    }).then(function (ev) {
      if (ev.length) reach = true;
      ev.forEach(function (e) { take({ on: e.on, by: "", at: e.at }); });
      return { reach: reach, rec: best };
    });
  }

  function get() {
    return liveDirs().then(function (dirs) { return Promise.all(dirs.map(readDir)); }).then(function (rs) {
      var any = false, best = null;
      rs.forEach(function (x) { if (x.reach) any = true; if (x.rec && (!best || x.rec.at >= best.at)) best = x.rec; });
      if (!any) throw new Error("server tidak terjangkau");
      var s = best || { on: false, by: "", at: 0 };
      state = { on: !!s.on, by: s.by || "", at: s.at || 0 };
      try { localStorage.setItem("pa-maint", JSON.stringify(state)); } catch (e) {}
      return state;
    }).catch(function () {
      // server tidak bisa diakses: pakai status terakhir yang tersimpan di browser ini
      try { var c = JSON.parse(localStorage.getItem("pa-maint") || "null"); if (c) state = c; } catch (e) {}
      return state;
    });
  }

  // Tulis ke satu folder: PUT maintenance.json → (MKCOL+PUT) → upload multipart berkas baru
  function writeDir(rd, st) {
    var body = JSON.stringify(st), name = "maint_" + st.at + "_" + (st.on ? 1 : 0) + ".json", trail = [], last = 0;
    function put() {
      return code("PUT", rd + "maintenance.json", { headers: { "Content-Type": "application/json" }, body: body }).then(function (c) { trail.push("PUT " + c); last = c; return c; });

    function post() {
      var fd = new FormData();

      return code("POST", rd, { body: fd }).then(function (c) { trail.push("POST " + c); last = c || last; return c; });
    }
    function verify() { return code("GET", rd + name).then(function (c) { return okc(c); }); }
    function done(how, ok) { return { ok: ok, how: how, st: last, dir: rd, trail: trail.join(", ") }; }
    return put().then(function (c) {
      if (okc(c)) return done("PUT", true);
      var again = (c === 404 || c === 409) ? mkdirs(rd).then(put) : Promise.resolve(c);
      return again.then(function (c2) {
        if (okc(c2)) return done("PUT", true);
        return post().then(function (p) {
          var re = (p === 404 || p === 409) ? mkdirs(rd).then(post) : Promise.resolve(p);
          return re.then(function (p2) {
            if (!okc(p2)) return done("POST", false);
            return verify().then(function (v) { return done("POST", v); });
          });
        });
      });
    });
  }

  // Hapus berkas status lama (opsional; gagal diabaikan)
  function tidy(rd, keepAt) {
    return listEvents(rd).then(function (ev) {
      return Promise.all(ev.filter(function (e) { return e.at < keepAt; }).map(function (e) { return code("DELETE", rd + e.name); }));
    }).catch(function () {});
  }

  function set(on, by) {
    var st = { on: !!on, by: low(by), at: Date.now() };
    return liveDirs().then(function (dirs) { return Promise.all(dirs.map(function (d) { return writeDir(d, st); })); }).then(function (rs) {
      lastDiag = rs.map(function (r) { return (r.ok ? "✔ " : "✘ ") + r.trail; }).join(" | ");
      var good = rs.filter(function (r) { return r.ok; });
      if (!good.length) {
        var c = 0;
        rs.forEach(function (r) { var s = r.st; if (s === 401 || s === 403) c = s; else if (!c && s) c = s; });
        liveC.t = 0;
        throw new Error("HTTP " + c + " (" + lastDiag + ")");
      }
      state = st;
      try { localStorage.setItem("pa-maint", JSON.stringify(st)); } catch (e) {}
      good.forEach(function (r) { tidy(r.dir, st.at); });
      return st;
    });
  }

/* ---------- cache thumbnail (IndexedDB) ---------- */
const TC = { max: 360, keep: 4000, db: null };
function tcOpen() {
  if (TC.db) return TC.db;

    try {

      q.onupgradeneeded = () => { const d = q.result; if (!d.objectStoreNames.contains('t')) d.createObjectStore('t'); if (!d.objectStoreNames.contains('l')) d.createObjectStore('l'); };
      q.onsuccess = () => { const d = q.result; d.onversionchange = () => { d.close(); TC.db = null; }; res(d); setTimeout(tcTrim, 4000); };
      q.onerror = q.onblocked = () => res(null);
    } catch { res(null); }
  });

}
const tcKey = it => it.url + '|' + (it.size == null ? '' : it.size) + '|' + (it.date || 0);
async function tcGet(k) {
  const d = await tcOpen(); if (!d) return null;
  return new Promise(res => { try { const r = d.transaction('t').objectStore('t').get(k); r.onsuccess = () => res(r.result && r.result.b ? r.result.b : null); r.onerror = () => res(null); } catch { res(null); } });
}

}

  try {
    const st = d.transaction('t', 'readwrite').objectStore('t'), c = st.count();
    c.onsuccess = () => {
      let extra = c.result - TC.keep; if (extra <= 0) return;
      const cur = st.openCursor();
      cur.onsuccess = () => { const x = cur.result; if (x && extra-- > 0) { x.delete(); x.continue(); } };
    };
  } catch { /* abaikan */ }
}
const LK = () => location.origin + location.pathname;
async function lcGet() {
  const d = await tcOpen(); if (!d) return null;
  return new Promise(res => { try { const r = d.transaction('l').objectStore('l').get(LK()); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch { res(null); } });
}
async function lcPut(mode, ap) {
  const d = await tcOpen(); if (!d) return;
  try { d.transaction('l', 'readwrite').objectStore('l').put({ mode, ap, at: Date.now() }, LK()); } catch { /* abaikan */ }
}
const TQ = { q: [], n: 0, max: 4 };
function tcPump() { while (TQ.n < TQ.max && TQ.q.length) { TQ.n++; TQ.q.shift()(); } }

let curTio = null;
function getTio() {

  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { io.unobserve(en.target); if (en.target._load) en.target._load(); } }), { rootMargin: '400px' });
  curTio = io; onCleanup(() => { io.disconnect(); if (curTio === io) curTio = null; });
  return io;
}
function tcMake(img, k) {

    const s = TC.max / Math.max(w, h), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));

}

function thumb(it, vio) {

  if (it.type === 'image') {
    const img = new Image(); img.alt = ''; img.decoding = 'async'; img.draggable = false;
    const k = tcKey(it); let bu = null, fromCache = false;
    const freeBu = () => { if (bu) { URL.revokeObjectURL(bu); bu = null; } };
    img.onload = () => { w.classList.add('ok'); if (fromCache) freeBu(); else if (it.type === 'image') tcMake(img, k); };
    img.onerror = () => { if (fromCache) { fromCache = false; freeBu(); img.src = it.url; return; } img.remove(); };
    w.appendChild(img);
    const fromNet = () => tcRun(() => {

      let rel = false; const free = () => { if (!rel) { rel = true; tcDone(); } };
      img.addEventListener('load', free, { once: true }); img.addEventListener('error', free, { once: true });

    w._load = () => { tcGet(k).then(b => { if (!w.isConnected) return; if (b) { fromCache = true; bu = URL.createObjectURL(b); img.src = bu; } else fromNet(); }, fromNet); };

    v.disablePictureInPicture = true;

const ACC_HOME = {'rifqyqq6@gmail.com': 'gallery.html', 'ozaacrew@gmail.com': 'StorageRaden.html', 'myprinces@gmail.com': 'StorageRaden.html', 'admin@gmail.com': 'glassydashboard.html'};
const AK = { KS: 'pa-session', KA: 'pa-accounts', DAYS: 30 };
function akRd(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } }
function akWr(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* abaikan */ } }
function akDrop(k) { try { localStorage.removeItem(k); } catch { /* abaikan */ } }
function akEm(x) { return x && x.e ? String(x.e).toLowerCase() : ''; }
function akFresh(x) { return !!(x && (!x.t || Date.now() - x.t < AK.DAYS * 864e5)); }

function akHue(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function akSwitch(e) {

  if (!x) return;
  if (!akFresh(x)) { location.replace(akLogin('?email=' + encodeURIComponent(e))); return; }

  { const cb = el('button', 'btn tonal', 'Kosongkan'); cb.type = 'button'; cb.onclick = () => tcClear().then(() => toast('Cache thumbnail dikosongkan')); a.appendChild(rowCtl('Cache thumbnail', 'Thumbnail kecil disimpan di perangkat agar galeri cepat dibuka', cb)); }
  c.appendChild(a);

  const b = el('div', 'set-card');

  const act = el('div', 'row'); const ab = el('button', 'btn', 'Pindai ulang'); ab.type = 'button'; ab.onclick = () => scan(true);

  const ab2 = el('div', 'set-card about');
  const inner = el('div', 'row col');
  inner.appendChild(el('b', null, 'Tentang'));
  inner.appendChild(el('p', null, 'Galeri otomatis memakai WebDAV server Anda (atau server.js bila ada) dan hanya mengelola folder RIFQY: menampilkan foto dan video, serta mengunggah, menghapus (ke Baru Dihapus), mengganti nama, dan memindahkan berkas, semuanya dari satu berkas HTML ini. Tanpa keduanya, galeri membaca daftar direktori server HTTP biasa dalam mode baca saja. Tidak ada data yang dikirim ke pihak luar.'));
  inner.appendChild(el('p', null, 'Thumbnail memakai berkas aslinya, jadi folder berisi foto sangat besar akan terasa lebih berat. Format HEIC, MKV, dan AVI hanya tampil jika didukung browser Anda.'));
  ab2.appendChild(inner); c.appendChild(ab2);
}

/* ---------- penampil ---------- */
const V = { open: false, list: [], i: 0, s: 1, x: 0, y: 0, tok: 0, media: null, lastTap: null, tapTimer: 0 };
const vwr = $('#viewer'), stage = $('#vstage');
const ptrs = new Map(); let g = null;

function copyText(t) {
  return (async () => {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch { /* fallback */ }
    try {
      const ta = el('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  })();
}
function downloadItem(it) {
  const a = el('a'); a.href = it.url; a.download = it.name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
function releaseMedia() {
  if (V.media) { if (V.media.tagName === 'VIDEO') releaseVideo(V.media); V.media.remove(); V.media = null; }
  stage.textContent = '';
}
function applyT(anim) {
  const m = V.media; if (!m || m.tagName !== 'IMG') return;
  m.style.transition = anim ? 'transform .2s ease' : 'none';
  m.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.s})`;
}
function clampPan() {
  const m = V.media; if (!m || m.tagName !== 'IMG') return;
  const r = stage.getBoundingClientRect();
  const mx = Math.max(0, (m.clientWidth * V.s - r.width) / 2), my = Math.max(0, (m.clientHeight * V.s - r.height) / 2);
  V.x = clamp(V.x, -mx, mx); V.y = clamp(V.y, -my, my);
}
function resetZoom(anim) { V.s = 1; V.x = 0; V.y = 0; applyT(anim); }
function zoomAt(cx, cy, ns, anim) {
  const m = V.media; if (!m || m.tagName !== 'IMG') return;
  ns = clamp(ns, 1, 8);
  const r = stage.getBoundingClientRect(), px = cx - r.left - r.width / 2, py = cy - r.top - r.height / 2;
  const k = ns / V.s;
  V.x = px - (px - V.x) * k; V.y = py - (py - V.y) * k; V.s = ns;
  if (ns <= 1.001) { V.s = 1; V.x = 0; V.y = 0; }
  clampPan(); applyT(anim);
}
function setErr(msg) {
  $('#vspin').hidden = true; $('#verr').hidden = !msg; if (msg) $('#verrMsg').textContent = msg;
}
function showItem(i, dir) {

  V.i = i; const it = V.list[i], tok = ++V.tok;
  ptrs.clear(); g = null; clearTimeout(V.tapTimer); V.lastTap = null;
  releaseMedia(); V.s = 1; V.x = 0; V.y = 0;
  setErr(''); $('#vspin').hidden = false;
  $('#vName').textContent = it.name; syncFav(); $('#vDel').hidden = !S.api;
  $('#vSub').textContent = `${i + 1} / ${V.list.length}` + (it.dir ? ' · ' + it.dir : '');
  $('#vPrev').disabled = i <= 0; $('#vNext').disabled = i >= V.list.length - 1;
  let m;
  if (it.type === 'image') {
    m = new Image(); m.alt = it.name; m.draggable = false; m.style.opacity = '0';
    m.onload = () => {
      if (tok !== V.tok) return;
      $('#vspin').hidden = true; m.style.opacity = ''; m.classList.add('enter');
      [i - 1, i + 1].forEach(j => { const o = V.list[j]; if (o && o.type === 'image') { const p = new Image(); p.src = o.url; } });
    };
    m.onerror = () => { if (tok !== V.tok) return; releaseMedia(); setErr('Gambar tidak dapat ditampilkan oleh browser (format .' + it.ext + ' mungkin tidak didukung).'); };
    m.src = it.url;
  } else {
    m = document.createElement('video'); m.controls = true; m.autoplay = true; m.playsInline = true; m.preload = 'auto';
    m.onloadeddata = () => { if (tok !== V.tok) return; $('#vspin').hidden = true; m.classList.add('enter'); };
    m.onerror = () => { if (tok !== V.tok) return; releaseMedia(); setErr('Video tidak dapat diputar oleh browser (format .' + it.ext + ' mungkin tidak didukung).'); };
    m.src = it.url;
  }
  V.media = m; stage.appendChild(m);
}
function openViewer(list, i) {
  if (V.open || !list.length) return;
  V.open = true; V.list = list; vwr.hidden = false; vwr.classList.remove('chrome-off'); syncLock();
  pushOverlay('viewer', closeViewer);
  showItem(i);
}
function closeViewer() {
  if (!V.open) return;
  V.open = false; V.tok++; clearTimeout(V.tapTimer); ptrs.clear(); g = null;
  releaseMedia(); vwr.hidden = true; setErr('');
  if (document.fullscreenElement && document.exitFullscreen) { try { document.exitFullscreen(); } catch { /* abaikan */ } }
  syncLock();
}
function step(d) { const j = V.i + d; if (j >= 0 && j < V.list.length) showItem(j, d); }
function toggleChrome() { vwr.classList.toggle('chrome-off'); }
function handleTap(e) {
  const now = Date.now(), lt = V.lastTap;
  if (lt && now - lt.t < 300 && Math.hypot(e.clientX - lt.x, e.clientY - lt.y) < 40) {
    clearTimeout(V.tapTimer); V.lastTap = null;
    if (V.s > 1) resetZoom(true); else zoomAt(e.clientX, e.clientY, 2.5, true);
    return;
  }
  V.lastTap = { t: now, x: e.clientX, y: e.clientY };
  clearTimeout(V.tapTimer);
  V.tapTimer = setTimeout(() => { V.lastTap = null; toggleChrome(); }, 300);
}

stage.addEventListener('pointerdown', e => {
  if (!V.media || V.media.tagName !== 'IMG' || !$('#verr').hidden) return;
  try { stage.setPointerCapture(e.pointerId); } catch { /* abaikan */ }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  V.media.style.transition = 'none';
  if (ptrs.size === 1) {
    g = { mode: 'pan', sx: e.clientX, sy: e.clientY, bx: V.x, by: V.y, moved: false, touch: e.pointerType !== 'mouse', dx: 0, dy: 0 };
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    g = { mode: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: V.s, cx0: (a.x + b.x) / 2, cy0: (a.y + b.y) / 2, bx: V.x, by: V.y, moved: true };
  }
});
stage.addEventListener('pointermove', e => {
  if (!g || !ptrs.has(e.pointerId) || !V.media) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (g.mode === 'pinch') {
    if (ptrs.size < 2) return;
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    const ns = clamp(g.s0 * d / g.d0, 1, 8), r = stage.getBoundingClientRect();
    const px = g.cx0 - r.left - r.width / 2, py = g.cy0 - r.top - r.height / 2;
    V.x = px - (px - g.bx) * (ns / g.s0); V.y = py - (py - g.by) * (ns / g.s0); V.s = ns;
    clampPan(); applyT(false); return;
  }
  const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
  if (Math.abs(dx) + Math.abs(dy) > 8) g.moved = true;
  if (V.s > 1) { V.x = g.bx + dx; V.y = g.by + dy; clampPan(); applyT(false); }
  else if (g.touch && g.moved) {
    g.dx = dx; g.dy = dy;
    V.media.style.transform = Math.abs(dx) >= Math.abs(dy) ? `translateX(${dx}px)` : `translateY(${dy > 0 ? dy : dy * 0.3}px)`;
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (!g || !V.media) { if (!ptrs.size) g = null; return; }
  if (g.mode === 'pinch') {
    if (ptrs.size === 1) { const p = [...ptrs.values()][0]; g = { mode: 'pan', sx: p.x, sy: p.y, bx: V.x, by: V.y, moved: true, touch: true, dx: 0, dy: 0 }; }
    else if (ptrs.size === 0) g = null;
    if (V.s < 1.02) resetZoom(true);
    return;
  }
  if (ptrs.size > 0) return;
  const up = e.type === 'pointerup', gg = g; g = null;
  const dx = gg.dx || 0, dy = gg.dy || 0;
  if (V.s > 1) { if (!gg.moved && up) handleTap(e); return; }
  if (gg.touch && gg.moved && up) {
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.3) {
      const d = dx < 0 ? 1 : -1;
      if (V.i + d >= 0 && V.i + d < V.list.length) { showItem(V.i + d, d); return; }
    } else if (dy > 110 && dy > Math.abs(dx) * 1.3) { closeOverlay('viewer'); return; }
  }
  resetZoom(true);
  if (!gg.moved && up) handleTap(e);
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', e => {
  if (!V.media || V.media.tagName !== 'IMG' || !$('#verr').hidden) return;
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, V.s * Math.exp(-e.deltaY * 0.0015), false);
}, { passive: false });
stage.addEventListener('contextmenu', e => { if (e.target && e.target.tagName === 'IMG') e.preventDefault(); });
window.addEventListener('resize', () => { if (V.open && V.media && V.media.tagName === 'IMG') { clampPan(); applyT(false); } });

function openInfo(it) {
  const body = openSheet('Detail', b => {
    const rows = {};
    const add = (k, label, val) => { const r = el('div', 'irow'); r.appendChild(el('small', null, label)); const v = el('div', 'v', val); r.appendChild(v); b.appendChild(r); rows[k] = v; };
    let dim = '—';
    const m = V.media;
    if (m && m.tagName === 'IMG' && m.naturalWidth) dim = `${m.naturalWidth} × ${m.naturalHeight} px`;
    else if (m && m.tagName === 'VIDEO' && m.videoWidth) dim = `${m.videoWidth} × ${m.videoHeight} px` + (isFinite(m.duration) ? ' · ' + fmtDur(m.duration) : '');
    add('name', 'Nama', it.name);
    add('dir', 'Folder', it.dir || '(folder utama)');
    add('type', 'Jenis', (it.type === 'image' ? 'Foto' : it.type === 'video' ? 'Video' : 'Berkas') + ' · .' + it.ext);
    add('size', 'Ukuran', it.size !== null ? fmtSize(it.size) : 'Memuat…');
    add('date', 'Diubah', it.date ? fmtDate(it.date) : 'Memuat…');
    add('dim', 'Dimensi', dim);
    add('url', 'Alamat', dec(new URL(it.url).pathname));
    if (it.size === null || !it.date) {
      fetch(it.url, { method: 'HEAD', credentials: 'same-origin' }).then(r => {
        if (!r.ok) throw new Error('x');
        const len = r.headers.get('content-length'), lm = r.headers.get('last-modified');
        if (len !== null && it.size === null && isFinite(+len)) it.size = +len;
        if (lm && !it.date) { const d = Date.parse(lm); if (isFinite(d)) it.date = d; }
      }).catch(() => { /* abaikan */ }).finally(() => {
        rows.size.textContent = it.size !== null ? fmtSize(it.size) : 'Tidak diketahui';
        rows.date.textContent = it.date ? fmtDate(it.date) : 'Tidak diketahui';
      });
    }
  });
  return body;
}
$('#vClose').onclick = () => closeOverlay('viewer');
$('#vPrev').onclick = () => step(-1);
$('#vNext').onclick = () => step(1);
$('#vDl').onclick = () => { const it = V.list[V.i]; if (it) downloadItem(it); };
$('#verrDl').onclick = () => { const it = V.list[V.i]; if (it) downloadItem(it); };
function copyLink(it) { copyText(new URL(it.url, location.href).href).then(ok => toast(ok ? 'Tautan disalin' : 'Tidak dapat menyalin tautan')); }
function toggleFs() {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  const r = vwr.requestFullscreen && vwr.requestFullscreen(); if (r && r.catch) r.catch(() => {});
}
function syncFav() {
  const it = V.list[V.i], b = $('#vFav'); if (!it) return;
  const on = S.fav.has(it.path); b.classList.toggle('on', on); b.textContent = ''; b.appendChild(icon(on ? 'heartFill' : 'heart')); b.setAttribute('aria-pressed', String(on));
}
$('#vFav').onclick = () => { const it = V.list[V.i]; if (!it) return; toggleFav(it); syncFav(); toast(S.fav.has(it.path) ? 'Ditambahkan ke Favorit' : 'Dihapus dari Favorit'); };
$('#vDel').onclick = () => { const it = V.list[V.i]; if (it) askDelete([it.path], true); };
$('#vMore').onclick = () => {
  const it = V.list[V.i]; if (!it) return;
  openSheet(it.name, b => {
    b.appendChild(optBtn('info', 'Detail', () => afterSheet(() => openInfo(it))));
    b.appendChild(optBtn('link', 'Salin tautan', () => { closeOverlay('sheet'); copyLink(it); }));
    if (document.fullscreenEnabled) b.appendChild(optBtn('fullscreen', 'Layar penuh', () => { closeOverlay('sheet'); toggleFs(); }));
    if (S.api) {
      b.appendChild(optBtn('edit', 'Ganti nama', () => afterSheet(() => askRename(it))));
      b.appendChild(optBtn('move', 'Pindahkan ke album', () => afterSheet(() => askMove([it.path]))));
    }
  });
};
/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (overlays.length) { closeOverlay(overlays[overlays.length - 1].name); e.preventDefault(); }
    else if (S.sel) { exitSel(); e.preventDefault(); }
    return;
  }
  if (!V.open || overlays.some(o => o.name === 'sheet')) return;
  const tg = e.target && e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
  const r = stage.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  switch (e.key) {
    case 'ArrowLeft': step(-1); e.preventDefault(); break;
    case 'ArrowRight': step(1); e.preventDefault(); break;
    case 'i': case 'I': { const it = V.list[V.i]; if (it) openInfo(it); break; }
    case 'Delete': { const it = V.list[V.i]; if (it && S.api) askDelete([it.path], true); break; }
    case '+': case '=': zoomAt(cx, cy, V.s * 1.4, true); break;
    case '-': case '_': zoomAt(cx, cy, V.s / 1.4, true); break;
    case '0': resetZoom(true); break;
    default: break;
  }
});

/* ---------- pencarian & init ---------- */
const qEl = $('#q'); let qt = 0;
qEl.addEventListener('input', () => {
  $('#qClear').hidden = !qEl.value;
  clearTimeout(qt);
  qt = setTimeout(() => {
    S.query = qEl.value;
    if (S.view !== 'gallery') { S.view = 'gallery'; S.album = null; }
    render();
  }, 140);
});
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') qEl.blur();
  else if (e.key === 'Escape' && qEl.value) { qEl.value = ''; qEl.dispatchEvent(new Event('input')); e.stopPropagation(); }
});
$('#qClear').onclick = () => { qEl.value = ''; qEl.dispatchEvent(new Event('input')); qEl.focus(); };
$('#btnRefresh').onclick = () => scan(true);
